# Prueba rápida: ¿qué máquinas Mac de GitHub están disponibles?
name: Probar máquinas Mac
on: workflow_dispatch
jobs:
  probar:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: echo "::notice::${{ matrix.os }} disponible ($(uname -m))"
