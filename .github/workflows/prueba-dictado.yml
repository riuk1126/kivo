# Prueba el dictado sin internet (Whisper en español) dentro del programa
name: Probar dictado
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        modelo: [onnx-community/whisper-small]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install && npm i --no-save playwright@1.48.2
      - run: node scripts/vendor.js | sed 's/^/::notice::/'
      - name: Audio de prueba
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng xvfb >/dev/null
          espeak-ng -v es-419 -s 140 -w test/es.wav "estoy llevando un curso de sketchup los lunes y miércoles de siete a nueve de la noche, dura ocho semanas"
      - run: xvfb-run -a node test/dictado.js
        env:
          MODELO: ${{ matrix.modelo }}
