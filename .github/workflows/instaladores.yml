# Construye los instaladores de Kivo (Windows, Mac y Linux) y los publica.
# Se ejecuta solo al crear una versión nueva (etiqueta v1.0.0, v1.0.1…)
# o a mano desde la pestaña "Actions" → "Construir instaladores" → "Run workflow".
name: Construir instaladores

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      solo_android:
        description: 'Solo volver a armar el APK de Android'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    if: ${{ !inputs.solo_android }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node scripts/vendor.js
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  # ---------- Android (APK) ----------
  # Ya no espera a Mac: sale al mismo tiempo que Windows
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install && node scripts/vendor.js
      - name: Preparar la app
        working-directory: movil
        run: |
          npm install
          rm -rf www android && mkdir www && cp -r ../app/* www/
          rm -f www/vendor/transformers.min.js www/vendor/ort-wasm* www/sw.js
          cp sin-conexion.html www/
          V=$(node -p "require('../package.json').version")
          sed -i "s/__KIVO_VERSION__/$V/" www/index.html
          npx cap add android
          cp -r res/* android/app/src/main/res/
          sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          for f in $(find android/app/src/main/res -name 'splash.png'); do
            W=$(identify -format '%w' "$f" || echo 0); H=$(identify -format '%h' "$f" || echo 0); [ "$W" = 0 ] && continue; M=$(( W<H ? W : H )); L=$(( M*38/100 ))
            convert -size ${W}x${H} xc:black \( splash-logo.png -resize ${L}x${L} \) -gravity center -composite "$f" || echo "splash sin cambiar: $f"
          done
          CODE=$(node -p "const [a,b,c]=require('../package.json').version.split('.').map(Number);a*10000+b*100+c")
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$V\"/" android/app/build.gradle
          npx cap sync android
      - name: Compilar
        working-directory: movil/android
        run: ./gradlew assembleRelease --no-daemon -q
      - name: Firmar y publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          $BT/zipalign -p -f 4 movil/android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks movil/kivo.jks --ks-key-alias kivo --ks-pass pass:kivo-arquizo-2026 --key-pass pass:kivo-arquizo-2026 --out Kivo.apk aligned.apk
          $BT/apksigner verify Kivo.apk && ls -la Kivo.apk
          V=$(node -p "require('./package.json').version")
          # espera a que Windows/Linux creen la versión (máx. 20 min); si no aparece, la crea
          for i in $(seq 1 40); do gh release view "v$V" >/dev/null 2>&1 && break; sleep 30; done
          gh release view "v$V" >/dev/null 2>&1 || gh release create "v$V" --title "$V" --notes "Kivo $V"
          gh release upload "v$V" Kivo.apk --clobber

  # ---------- Versión web instalable (iPhone y Android) ----------
  web:
    if: ${{ !inputs.solo_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install && node scripts/vendor.js
      - name: Publicar en GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf site && mkdir site && cp -r app/* site/
          rm -f site/vendor/transformers.min.js site/vendor/ort-wasm*
          V=$(node -p "require('./package.json').version")
          sed -i "s/__KIVO_VERSION__/$V/" site/index.html
          sed -i "s/const C = 'kivo-v1'/const C = 'kivo-$V'/" site/sw.js
          touch site/.nojekyll
          cd site && git init -q && git checkout -q -b gh-pages && git add -A
          git -c user.name="Kivo" -c user.email="kivo@users.noreply.github.com" commit -qm "Kivo web $V"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
