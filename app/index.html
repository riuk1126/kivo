    const g=h('div','cgrid');['lu','ma','mi','ju','vi','sá','do'].forEach(d=>g.append(h('div','dw',d)));
    const off=(vm.getDay()+6)%7;const start=new Date(vm.getFullYear(),vm.getMonth(),1-off);const t=today();
    const busy=new Set(open().map(x=>x.date));
    for(let i=0;i<42;i++){
      const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);const s=iso(d);

    if(st.time){const n=h('button','chip','Sin hora');n.onclick=()=>{st.time='';draw()};tr.append(n)}
    box.append(tr);
    const two=h('div','two');
    const c1=h('div');c1.append(h('div','lbl','Avisarme'));const rs=h('select','field');Object.entries(REMINDS).forEach(([k,v])=>{const o=h('option','',v);o.value=k;if(k===st.remind)o.selected=true;rs.append(o)});rs.onchange=()=>{st.remind=rs.value};c1.append(rs);

    const f=h('div','foot');f.append(h('div','grow'));

/* ---------- hecho / repetir ---------- */
function nextDate(d,rep){
  const x=pd(d||today());
  if(rep==='day')x.setDate(x.getDate()+1);
  else if(rep==='week5'){do{x.setDate(x.getDate()+1)}while(x.getDay()===0||x.getDay()===6)}
  else if(rep==='week')x.setDate(x.getDate()+7);
  else if(rep==='month'){const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+1);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}
  let s=iso(x);if(s<today()&&rep)return nextDate(s,rep);return s;
}
function setDone(x,done){
  if(done){
    x.status='done';x.doneAt=Date.now();x.doneOn=today();x.snooze=null;x.doneBy=ME;x.progress=100;
    {const T=tplOf(listOf(x.list));if(T)x.stage=T.stages[T.stages.length-1]}
    if(x.repeat&&!x.spawned){x.spawned=true;const n=fixTask(JSON.parse(JSON.stringify(x)));Object.assign(n,{id:uid(),owner:ME,progress:0,doneBy:null,stage:null,status:'todo',doneAt:null,doneOn:null,doneNote:'',mood:'',alerted:'',spawned:false,date:nextDate(x.date,x.repeat),at:Date.now()});n.subtasks.forEach(s=>{s.done=false;s.id=uid()});S.tasks.push(n)}
  }else{x.status='todo';x.doneAt=null;x.doneOn=null;x.doneBy=null;if(x.progress===100)x.progress=0;const T=tplOf(listOf(x.list));if(T&&x.stage===T.stages[T.stages.length-1])x.stage=T.stages[T.stages.length-2]}
  save();
}
function toggleDone(x,el,rowEl){
  if(x.status==='done'){setDone(x,false);renderList();return}
  setDone(x,true);sfx('done');
  if(el){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,28,7)}
  if(rowEl){rowEl.classList.add('done');setTimeout(()=>{rowEl.classList.add('leaving');setTimeout(renderList,330)},280)}else renderList();
  const left=open().filter(y=>y.date&&y.date<=today()).length;
  if(left===0&&x.date&&x.date<=today()){setTimeout(()=>{bigParty();toast('🎉 ¡Terminaste todo lo de hoy!','¿Cómo te fue?',()=>openDetail(x,true))},350)}
  else toast(x.repeat?'¡Hecha! ✅ La siguiente queda para '+fmtDate(nextDate(x.date,x.repeat)).toLowerCase():'¡Hecha! ✅','¿Cómo te fue?',()=>openDetail(x,true));
}
function streak(){const set=new Set(S.tasks.filter(t=>t.doneOn).map(t=>t.doneOn));let n=0,d=set.has(today())?0:1;while(set.has(plus(-d))){n++;d++}return n}
function clearDone(){const n=S.tasks.filter(x=>x.status==='done').length;if(!n){toast('No hay tareas hechas');return}const old=S.tasks.slice();S.tasks=S.tasks.filter(x=>x.status!=='done');save();renderList();toast(n+' tareas hechas borradas','Deshacer',()=>{S.tasks=old;save();renderList()})}

function tick(){
  if(!S.alerts||!S.onboarded)return;
  const now=Date.now(),t=today(),d=new Date(),hm=pad(d.getHours())+':'+pad(d.getMinutes());
  open().filter(mineOrFree).forEach(x=>{
    if(x.snooze&&now>=x.snooze){x.snooze=null;save();fireTask(x);return}
    if(!x.date||!x.time||x.remind==='none'||x.snooze)return;
    const at=dueMs(x)-Number(x.remind||0)*6e4,key=x.date+'|'+x.time+'|'+x.remind;
    if(x.alerted!==key&&now>=at&&now-at<6*36e5){x.alerted=key;save();fireTask(x)}
  });
  if(S.lastMorning!==t&&hm>=S.morning){
    S.lastMorning=t;save();const op=open().filter(mineOrFree),td=op.filter(x=>x.date===t),late=op.filter(x=>x.date&&x.date<t);
    if(td.length+late.length)fireSummary(greet()+(S.name?', '+S.name:'')+' ☀️ Hoy tienes '+(td.length+late.length)+' pendiente'+(td.length+late.length>1?'s':''),listTxt(late.concat(td))+(late.length?'\n⚠️ '+late.length+' atrasada'+(late.length>1?'s':''):''),'hoy');
  }
  if(S.lastEvening!==t&&hm>=S.evening){
    S.lastEvening=t;save();const tm=open().filter(mineOrFree).filter(x=>x.date===plus(1));
    if(tm.length)fireSummary('🌙 Para mañana tienes '+tm.length+' pendiente'+(tm.length>1?'s':''),listTxt(tm),'prox');
  }
  const dow=d.getDay();let wk=null,off=0;
  if(dow===0&&hm>=S.evening){wk=weekStart(0);off=0}else if(dow===1){wk=weekStart(-1);off=-1}
  if(wk&&S.lastWeekly!==wk){
    S.lastWeekly=wk;save();const n=S.tasks.filter(x=>x.status==='done'&&x.doneOn>=wk&&x.doneOn<=plus(6,wk)).length;
    const title='📊 Tu resumen de la semana',body=n?'Completaste '+n+' tarea'+(n>1?'s':'')+'. ¡Mira cómo te fue!':'Mira cómo te fue esta semana.';

    inAppAlert(title,body,[['Ver resumen',()=>{statsOff=off;openStats()},true]],60000);
  }
}

let AC=null;

function sfx(kind){
  if(!S.sound)return;const c=ac();if(!c)return;const t=c.currentTime;
  const notes=kind==='alert'?[[784,0],[1047,.16],[1319,.32]]:[[660,0],[990,.09]];
  notes.forEach(([f,dl])=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+dl);g.gain.linearRampToValueAtTime(kind==='alert'?.2:.12,t+dl+.02);g.gain.exponentialRampToValueAtTime(.001,t+dl+(kind==='alert'?.6:.3));o.connect(g);g.connect(c.destination);o.start(t+dl);o.stop(t+dl+.65)});
}

const FX=$('#fx'),G=FX.getContext('2d');let parts=[],raf=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(x,y,n,sp){
  if(reduce)return;const cols=[S.accent,'#ffd43b','#51cf66','#4dabf7','#f783ac','#ff922b'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=Math.random()*sp+2;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.6,s:4+Math.random()*5,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:70+Math.random()*40})}
  if(!raf)loop();
}
function bigParty(){burst(innerWidth*.2,innerHeight*.8,70,13);burst(innerWidth*.8,innerHeight*.8,70,13);setTimeout(()=>burst(innerWidth/2,innerHeight*.4,60,10),250);sfx('alert')}
function loop(){
  const dpr=devicePixelRatio||1;if(FX.width!==innerWidth*dpr){FX.width=innerWidth*dpr;FX.height=innerHeight*dpr}
  G.setTransform(dpr,0,0,dpr,0,0);G.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;G.save();G.globalAlpha=Math.min(1,p.life/25);G.translate(p.x,p.y);G.rotate(p.r);G.fillStyle=p.c;G.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);G.restore()});
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+30);raf=parts.length?requestAnimationFrame(loop):(G.clearRect(0,0,innerWidth,innerHeight),null);
}

}
function lum(hex){const m=String(hex||'').replace('#','');const f=m.length===3?m.split('').map(c=>c+c).join(''):m;const n=parseInt(f,16);if(isNaN(n))return .5;return .2126*((n>>16)&255)/255+.7152*((n>>8)&255)/255+.0722*(n&255)/255}

function hl(text,q){
  const map=[];let ns='';
  for(let i=0;i<text.length;i++){const c=norm(text[i]);for(let k=0;k<c.length;k++)map.push(i);ns+=c}
  const k=ns.indexOf(q);if(k<0||!q)return esc(text);
  const a=map[k],b=map[k+q.length-1]+1;return esc(text.slice(0,a))+'<mark>'+esc(text.slice(a,b))+'</mark>'+esc(text.slice(b));
}

let syncT=null,flushP=null,again=false,retryT=null;
function scheduleSync(){if(!ME||!READY)return;setSync('busy');clearTimeout(syncT);syncT=setTimeout(flush,450)}
function flush(){
  if(!ME||!READY||!sb)return Promise.resolve();
  if(flushP){again=true;return flushP}
  flushP=doFlush().catch(e=>{if(e&&e.retry){again=true;return}console.warn('sync',e);setSync('err');clearTimeout(retryT);retryT=setTimeout(flush,12000)}).finally(()=>{flushP=null;if(again){again=false;flush()}});
  return flushP;

const actRow=(t,kind,body)=>({id:uid(),task_id:t.id,user_id:ME,kind,body:body||'',task_text:t.text||'',dev:DEV});
async function doFlush(){
  const curL=new Set(S.lists.map(l=>l.id));
  for(const l of S.lists){
    const r=listRow(l),j=JSON.stringify(r);
    if(!(l.id in SYNC.lists)){l.owner=l.owner||ME;const {error}=await sb.from('lists').insert({...r,owner:l.owner});if(error){if(colErr(error))throw {retry:true};throw error}if(!LMEM[l.id])LMEM[l.id]=[ME];SYNC.lists[l.id]=j}
    else if(SYNC.lists[l.id]!==j){const {error}=await sb.from('lists').update(r).eq('id',l.id);if(error){if(colErr(error))throw {retry:true};if(isNet(error))throw error;console.warn(error)}SYNC.lists[l.id]=j}
  }
  for(const id of Object.keys(SYNC.lists)){
    if(curL.has(id))continue;
    const a=await sb.from('lists').delete().eq('id',id);if(a.error&&isNet(a.error))throw a.error;
    const b=await sb.from('list_members').delete().eq('list_id',id).eq('user_id',ME);if(b.error&&isNet(b.error))throw b.error;
    delete SYNC.lists[id];delete LMEM[id];
  }
  const ins=[],upd=[],acts=[],ids=new Set();
  for(const t of S.tasks){
    ids.add(t.id);if(t.list&&!curL.has(t.list))t.list='';
    const r=taskRow(t),j=JSON.stringify(r);
    if(!(t.id in SYNC.tasks)){ins.push({t,r,j});if(isShared(t.list))acts.push(t.assignee&&t.assignee!==ME?actRow(t,'assign',t.assignee):actRow(t,'create'))}
    else if(SYNC.tasks[t.id]!==j){
      upd.push({t,r,j});let o={};try{o=JSON.parse(SYNC.tasks[t.id])}catch(e){}
      const progCh=o.progress!==r.progress&&r.status!=='done'&&r.progress>0;
      if(o.status!==r.status&&!(r.status==='doing'&&progCh))acts.push(actRow(t,'status',r.status));
      else if(progCh)acts.push(actRow(t,'progress',String(r.progress)));
      if((o.assignee||null)!==(r.assignee||null))acts.push(actRow(t,'assign',r.assignee||''));
      if((o.date||null)!==(r.date||null)&&r.status!=='done')acts.push(actRow(t,'date',r.date||''));
    }
  }
  const del=Object.keys(SYNC.tasks).filter(id=>!ids.has(id));
  if(ins.length){
    const rows=ins.map(({t,r})=>({...r,owner:t.owner||ME,updated_by:ME,updated_dev:DEV}));
    const {error}=await sb.from('tasks').insert(rows);if(error&&colErr(error))throw {retry:true};
    if(!error)ins.forEach(x=>{x.t.owner=x.t.owner||ME;SYNC.tasks[x.t.id]=x.j});
    else{if(isNet(error))throw error;
      for(const x of ins){const e2=(await sb.from('tasks').insert({...x.r,owner:x.t.owner||ME,updated_by:ME,updated_dev:DEV})).error;if(e2&&isNet(e2))throw e2;if(!e2){x.t.owner=x.t.owner||ME;SYNC.tasks[x.t.id]=x.j}else console.warn('insert',e2)}}
  }
  for(const x of upd){const {error}=await sb.from('tasks').update({...x.r,updated_by:ME,updated_dev:DEV}).eq('id',x.t.id);if(error){if(colErr(error))throw {retry:true};if(isNet(error))throw error;console.warn('update',error)}SYNC.tasks[x.t.id]=x.j}
  if(del.length){const {error}=await sb.from('tasks').delete().in('id',del);if(error&&isNet(error))throw error;del.forEach(id=>delete SYNC.tasks[id])}
  const okActs=acts.filter(a=>a.task_id in SYNC.tasks);
  if(okActs.length){sb.from('activity').insert(okActs).then(()=>{},()=>{});okActs.forEach(a=>{if(ACT[a.task_id])ACT[a.task_id].items.unshift({...a,created_at:new Date().toISOString()})})}
  cacheLocal();setSync('ok');
}

async function doFetch(){
  const [L,M,P,T]=await Promise.all([sb.from('lists').select('*'),sb.from('list_members').select('*'),sb.from('profiles').select('*'),sb.from('tasks').select('*')]);
  const err=L.error||M.error||P.error||T.error;if(err)throw err;
  MEMBERS={};(P.data||[]).forEach(p=>MEMBERS[p.id]=p);
  if(!MEMBERS[ME])MEMBERS[ME]={id:ME,name:S.name,email:MYEMAIL,color:S.accent};
  LMEM={};(M.data||[]).forEach(m=>(LMEM[m.list_id]=LMEM[m.list_id]||[]).push(m.user_id));
  const prev={};S.tasks.forEach(t=>prev[t.id]=t);
  const serverIds=new Set((T.data||[]).map(r=>r.id));
  const next=[];
  (T.data||[]).forEach(r=>{
    const inc=fromTaskRow(r),loc=prev[inc.id];
    if(loc&&(inc.id in SYNC.tasks)&&JSON.stringify(taskRow(loc))!==SYNC.tasks[inc.id]){next.push(loc);return}
    if(loc){inc.alerted=loc.alerted;inc.snooze=loc.snooze}
    if(r.stage===undefined){NOCOLS=true;inc.stage=loc?loc.stage:null;inc.fields=loc?loc.fields:{}}
    next.push(inc);SYNC.tasks[inc.id]=JSON.stringify(taskRow(inc));
  });
  S.tasks.forEach(t=>{if(!serverIds.has(t.id)&&!(t.id in SYNC.tasks))next.push(t)});
  Object.keys(SYNC.tasks).forEach(id=>{if(!serverIds.has(id))delete SYNC.tasks[id]});
  S.tasks=next;
  const sL=new Set((L.data||[]).map(l=>l.id));
  const localNew=S.lists.filter(l=>!sL.has(l.id)&&!(l.id in SYNC.lists));
  const order=S.lists.map(l=>l.id);
  const prevL={};S.lists.forEach(x=>prevL[x.id]=x);
  const oldSL=Object.assign({},SYNC.lists),keepL=new Set();
  S.lists=(L.data||[]).map(r=>{const pv=prevL[r.id];if(pv&&(r.id in oldSL)&&JSON.stringify(listRow(pv))!==oldSL[r.id]){keepL.add(r.id);return pv}const x=fromListRow(r);if(r.kind===undefined){NOCOLS=true;x.kind=(pv&&pv.kind)||'general'}if(r.meta===undefined){NOMETA=true;x.meta=(pv&&pv.meta)||{}}else if(pv&&pv.meta&&!r.meta)x.meta=pv.meta;return x}).sort((a,b)=>{const ia=order.indexOf(a.id),ib=order.indexOf(b.id);return (ia<0?999:ia)-(ib<0?999:ib)}).concat(localNew);
  SYNC.lists={};S.lists.forEach(l=>{if(sL.has(l.id))SYNC.lists[l.id]=keepL.has(l.id)?oldSL[l.id]:JSON.stringify(listRow(l))});
  if(S.filter!=='all'&&!listOf(S.filter))S.filter='all';
  const meP=MEMBERS[ME];
  if(meP.name&&!S.name)S.name=meP.name;
  if((S.name&&meP.name!==S.name)||meP.color!==S.accent)updateProfile();
  lastJ=snapJ();HIST=[];REDO=[];cacheLocal();
}

function subscribe(){
  try{if(CH)sb.removeChannel(CH)}catch(e){}
  CH=sb.channel('kivo-equipo',{config:{presence:{key:ME}}})
    .on('postgres_changes',{event:'*',schema:'public',table:'tasks'},onTaskEvt)
    .on('postgres_changes',{event:'*',schema:'public',table:'lists'},refetchSoon)
    .on('postgres_changes',{event:'*',schema:'public',table:'list_members'},refetchSoon)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'activity'},onActEvt)
    .on('presence',{event:'sync'},onPresence)
    .subscribe(st=>{if(st==='SUBSCRIBED'){try{CH.track({id:ME,name:S.name||''})}catch(e){}}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){setTimeout(subscribe,8000)}});
}

function onTaskEvt(p){
  if(p.eventType==='DELETE'){
    const id=p.old&&p.old.id;if(!id)return;const ex=S.tasks.find(t=>t.id===id);if(!ex)return;
    S.tasks=S.tasks.filter(t=>t!==ex);delete SYNC.tasks[id];
    if(CURDETAIL&&CURDETAIL.x===ex){closeModal();toast('Esta tarea fue eliminada por tu equipo')}
    afterRemote(id);return;
  }
  const r=p.new;if(r&&r.updated_dev==='claude'&&r.updated_by===ME)claudeSeen(r,p.eventType);
  if(!r||!r.id||r.updated_dev===DEV)return;
  if(r.list_id&&!listOf(r.list_id)){refetchSoon();return}
  const inc=fromTaskRow(r),ex=S.tasks.find(t=>t.id===inc.id);
  if(inc.stage===undefined){inc.stage=ex?ex.stage:null;inc.fields=ex?ex.fields:{}}
  if(ex){const keep={alerted:ex.alerted,snooze:ex.snooze};Object.assign(ex,inc,keep)}else S.tasks.push(inc);
  SYNC.tasks[inc.id]=JSON.stringify(taskRow(ex||inc));
  afterRemote(inc.id);
}

function agoTxt(iso){const ms=Date.now()-new Date(iso).getTime();const m=Math.round(ms/6e4);if(m<1)return 'ahora';if(m<60)return 'hace '+m+' min';const hh=Math.round(m/60);if(hh<24)return 'hace '+hh+' h';return fmtStamp(new Date(iso).getTime())}

async function fileURL(a,download){
  if(!a||!a.path)return null;const k=a.path+(download?'#dl':'');const c=SIGNED[k];if(c&&c.exp>Date.now())return c.url;
  const {data,error}=await sb.storage.from('adjuntos').createSignedUrl(a.path,3600,download?{download:a.name}:undefined);
  if(error||!data)return null;SIGNED[k]={url:data.signedUrl,exp:Date.now()+50*6e4};return data.signedUrl;
}
function fmtSize(b){return b<1e6?Math.max(1,Math.round(b/1024))+' KB':(b/1e6).toFixed(1)+' MB'}
function fileIcon(a){const n=norm(a.name),t=a.type||'';
  if(/pdf/.test(t)||n.endsWith('.pdf'))return '📕';if(/\.(docx?|odt)$/.test(n))return '📘';if(/\.(xlsx?|csv|ods)$/.test(n))return '📗';
  if(/\.(pptx?|key)$/.test(n))return '📙';if(/\.(dwg|dxf|skp|rvt)$/.test(n))return '📐';if(/\.(cdr|ai|psd|svg|eps)$/.test(n))return '🎨';
  if(/\.(zip|rar|7z)$/.test(n))return '🗜️';if(t.startsWith('audio/'))return '🎵';if(t.startsWith('video/'))return '🎬';if(t.startsWith('image/'))return '🖼️';return '📄'}
function compressImg(file){return new Promise(res=>{
  if(/gif|svg/.test(file.type)||file.size<300000){res(file);return}
  const u=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const k=Math.min(1,1800/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b&&b.size<file.size?b:file),'image/webp',.86)};
  im.onerror=()=>{URL.revokeObjectURL(u);res(file)};im.src=u})}
const safeName=n=>String(n||'archivo').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_').slice(-80)||'archivo';
async function uploadBlob(taskId,name,blob){

  const {error}=await sb.storage.from('adjuntos').upload(path,blob,{contentType:blob.type||'application/octet-stream',upsert:false});
  if(error)return null;return{id,name,type:blob.type||'',size:blob.size,at:Date.now(),path};
}
async function addFiles(x,files,redraw){
  if(!files.length)return;await flush();

  toast(files.length>1?'Subiendo '+files.length+' archivos…':'Subiendo…');let n=0;
  for(const f of files){
    if(f.size>45e6){toast('«'+f.name+'» pesa mucho (máximo 45 MB)');continue}
    const isImg=(f.type||'').startsWith('image/');const blob=isImg?await compressImg(f):f;
    const nm=f.name&&f.name!=='image.png'?f.name:'imagen-'+today()+'.'+(((blob.type||'image/png').split('/')[1])||'png');
    const a=await uploadBlob(x.id,nm,blob);if(!a){toast('No pude subir «'+nm+'» 😕');continue}

function repeatsOn(x,ds){
  if(!x.repeat||!x.date||ds<=x.date)return false;const d=pd(ds),o=pd(x.date),w=d.getDay();
  if(x.repeat==='day')return true;if(x.repeat==='week5')return w>=1&&w<=5;if(x.repeat==='week')return w===o.getDay();if(x.repeat==='month')return d.getDate()===o.getDate();return false;
}
function weekData(off,opt){
  const ws=weekStart(off),days=[],t=today();
  const mine=x=>!opt.list||x.list===opt.list;
  const okL=l=>!opt.list||l.id===opt.list;
  const tasks=S.tasks.filter(mineOrFree).filter(mine);
  for(let i=0;i<7;i++){const ds=plus(i,ws),dow=pd(ds).getDay(),items=[];
    schedLists().filter(okL).forEach(l=>slotsOf(l).forEach(s=>{if((s.d||[]).includes(dow))items.push({k:'slot',t:s.s,e:s.e,txt:(TPL[l.kind].sched==='write'&&s.label==='Escribir'?'Escribir':s.label),sub:[l.name===s.label?'':l.name,s.room].filter(Boolean).join(' · '),c:s.color||l.color})}));
    tasks.forEach(x=>{const on=x.date===ds||repeatsOn(x,ds);if(!on)return;if(x.status==='done'&&!(opt.done&&x.doneOn===ds))return;
      const l=listOf(x.list);items.push({k:'task',t:x.time||'',txt:x.text,sub:l?l.name:'',c:l?l.color:'#888',star:x.star,done:x.status==='done',steps:x.subtasks.filter(s=>!s.done).length})});
    items.sort((a,b)=>(a.t||'99')<(b.t||'99')?-1:(a.t||'99')>(b.t||'99')?1:a.k==='slot'?-1:1);
    days.push({ds,dow,items,today:ds===t});
  }
  const late=opt.late?tasks.filter(x=>x.status!=='done'&&x.date&&x.date<ws).sort(sortT):[];
  const nodate=opt.nodate?tasks.filter(x=>x.status!=='done'&&!x.date).sort(sortT):[];
  return {ws,days,late,nodate};
}

function gridWeek(W,opt){
  let mn=24*60,mx=0;
  W.days.forEach(d=>d.items.forEach(it=>{if(!it.t)return;const a=toMin(it.t),b=it.e?Math.max(toMin(it.e),a+30):a+60;mn=Math.min(mn,a);mx=Math.max(mx,b)}));
  if(mx===0){mn=8*60;mx=18*60}
  mn=Math.max(0,Math.min(Math.floor(mn/60)*60,7*60));mx=Math.min(24*60,Math.max(Math.ceil(mx/60)*60,20*60));
  const extra=(W.late.length?1:0)+(W.nodate.length?1:0)+(opt.notes?1:0);
  const PH=opt.ph||Math.max(15,Math.min(30,Math.floor((560-extra*62)/((mx-mn)/60))));
  const H=(mx-mn)/60*PH,hl=m=>{const h=Math.floor(m/60)%24;return (h%12||12)+(h<12?' am':' pm')};
  let hours='';for(let m=mn;m<mx;m+=60)hours+=`<span style="top:${(m-mn)/60*PH}px">${hl(m)}</span>`;
  const head=W.days.map(d=>`<div class="gh${d.today?' tod':''}"><b>${DAYS[d.dow]}</b><span>${pd(d.ds).getDate()}</span></div>`).join('');
  const untimed=W.days.map(d=>{const u=d.items.filter(it=>!it.t);return `<div class="gu">${u.map(it=>`<div class="li${it.done?' done':''}"><i class="bx"></i><span>${it.star?'★ ':''}${esc(it.txt)}</span></div>`).join('')}</div>`}).join('');
  const anyU=W.days.some(d=>d.items.some(it=>!it.t));
  const cols=W.days.map(d=>{
    const ev=d.items.filter(it=>it.t).map(it=>{const a=toMin(it.t);return Object.assign({},it,{a,b:it.e?Math.max(toMin(it.e),a+30):a+60})}).sort((x,y)=>x.a-y.a||y.b-x.b);
    // carriles para lo que se cruza
    let cl=[],end=-1;const groups=[];ev.forEach(x=>{if(x.a>=end&&cl.length){groups.push(cl);cl=[]}cl.push(x);end=Math.max(end,x.b)});if(cl.length)groups.push(cl);
    groups.forEach(g=>{const lanes=[];g.forEach(x=>{let i=lanes.findIndex(e=>e<=x.a);if(i<0){i=lanes.length;lanes.push(0)}lanes[i]=x.b;x.lane=i});g.forEach(x=>x.n=lanes.length)});
    const blocks=ev.map(x=>{const top=(Math.max(x.a,mn)-mn)/60*PH,ht=Math.max(20,(Math.min(x.b,mx)-Math.max(x.a,mn))/60*PH-2),w=100/x.n;
      const tm=fmtTime(x.t).replace(/\s?([ap])\.?\s?m\.?/i,'$1')+(x.e?'–'+fmtTime(x.e).replace(/\s?([ap])\.?\s?m\.?/i,'$1'):'');
      return `<div class="gb ${x.k}${x.done?' done':''}" style="top:${top}px;height:${ht}px;left:calc(${x.lane*w}% + 1px);width:calc(${w}% - 2px);--c:${esc(x.c)}">${x.k==='task'?'<i class="bx"></i>':''}<div><b>${x.star?'★ ':''}${esc(x.txt)}</b><small>${esc(tm)}${x.sub?' · '+esc(x.sub):''}</small></div></div>`}).join('');
    return `<div class="gc${d.today?' tod':''}" style="height:${H}px;background-size:100% ${PH}px">${blocks}</div>`}).join('');
  return `<div class="tgrid"><div class="gh hcol"></div>${head}${anyU?`<div class="gu hcol">Sin hora</div>${untimed}`:''}<div class="hcol hours" style="height:${H}px">${hours}</div>${cols}</div>`;
}

function scheduleNative(){clearTimeout(natT);natT=setTimeout(async()=>{
  const P=LN();if(!P||!NATIVE_OK||!ME)return;
  const now=Date.now(),lim=now+10*864e5,out=[];
  if(S.alerts)open().filter(mineOrFree).forEach(x=>{if(!x.date||!x.time||x.remind==='none')return;const at=dueMs(x)-Number(x.remind||0)*6e4;if(at>now+3e4&&at<lim){const l=listOf(x.list);out.push({id:nid(x.id+'|'+x.date+x.time),title:noEmo(x.text),body:(Number(x.remind)?'En '+(Number(x.remind)>=60?Number(x.remind)/60+' h':x.remind+' min')+', a las ':'Ahora, ')+fmtTime(x.time)+(l?' · '+l.name:''),schedule:{at:new Date(at),allowWhileIdle:true},extra:{task:x.id}})}});
  if(S.alerts)for(let i=0;i<8;i++){const ds=plus(i),dow=pd(ds).getDay();schedLists().forEach(l=>slotsOf(l).forEach(s=>{if(!(s.d||[]).includes(dow))return;const at=atMs(ds,s.s)-6e5;if(at>now+3e4&&at<lim)out.push({id:nid(l.id+s.id+ds),title:noEmo((TPL[l.kind].sched==='class'?'Clase en 10 min: ':'En 10 min: ')+s.label),body:fmtTime(s.s)+(s.room?' · '+s.room:'')+' · '+l.name,schedule:{at:new Date(at),allowWhileIdle:true}})}))}
  out.sort((a,b)=>a.schedule.at-b.schedule.at);
  try{const pend=await P.getPending();if(pend.notifications&&pend.notifications.length)await P.cancel({notifications:pend.notifications.map(n=>({id:n.id}))});if(out.length)await P.schedule({notifications:out.slice(0,60)})}catch(e){console.warn('avisos',e)}
},1500)}

async function cotRPC(d){
  const t=cotTeam();const reply=(data,err,code)=>cotPost({reply:d.id,data,err,code});
  if(!t)return reply(null,'Sin acceso al equipo de Arquizo');
  const a=d.args||{},p=String(a.p||'');
  try{
    if(d.op==='get'){
      if(p.startsWith('config/')){const {data,error}=await sb.from('cot_config').select('data').eq('team',t.id).eq('key',p.slice(7)).limit(1);if(error)throw error;return reply(data&&data[0]?data[0].data:null)}
      if(p.startsWith('cotizaciones/')){const {data,error}=await sb.from('cotizaciones').select('data').eq('id',p.slice(13)).limit(1);if(error)throw error;return reply(data&&data[0]?data[0].data:null)}
    }
    if(d.op==='set'){
      if(p.startsWith('config/')){const key=p.slice(7);const ex=await sb.from('cot_config').select('key').eq('team',t.id).eq('key',key).limit(1);if(ex.error)throw ex.error;
        const r=ex.data&&ex.data.length?await sb.from('cot_config').update({data:a.v}).eq('team',t.id).eq('key',key):await sb.from('cot_config').insert({team:t.id,key,data:a.v});if(r.error)throw r.error;return reply(true)}
      if(p.startsWith('cotizaciones/')){const id=p.slice(13);if(a.v&&typeof a.v==='object'){if(!a.v.autor){a.v.autor=pname(ME);a.v.autorId=ME}a.v.editadoPor=pname(ME)}const row={data:a.v,actualizado:Number(a.v&&a.v.actualizado)||Date.now(),updated_by:ME};
        const ex=await sb.from('cotizaciones').select('id').eq('id',id).limit(1);if(ex.error)throw ex.error;
        const r=ex.data&&ex.data.length?await sb.from('cotizaciones').update(row).eq('id',id):await sb.from('cotizaciones').insert(Object.assign({id,team:t.id},row));if(r.error)throw r.error;cotSnap();return reply(true)}
    }
    if(d.op==='del'&&p.startsWith('cotizaciones/')){const r=await sb.from('cotizaciones').delete().eq('id',p.slice(13));if(r.error)throw r.error;cotSnap();return reply(true)}
    if(d.op==='pdf')return reply(await cotPDF(a.fn,a.html,a.css));
    reply(null,'Operación no válida');
  }catch(e){const m=String(e&&e.message||e);reply(null,/cotizaciones|cot_config|relation|schema cache/i.test(m)?'Falta el paso de la base de datos (código 5 en Supabase)':m,/quota|too large/i.test(m)?'quota_exceeded':undefined)}
}
async function cotPDF(fn,html,css){

  root.innerHTML=`<style>${css}\n#print-area{display:block!important}#print-area .sheet{width:auto;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}</style><div id="print-area">${html}</div>`;
  const pg=h('style');pg.id='cotPage';pg.textContent='@page{size:A4 portrait;margin:12mm 13mm}';document.head.append(pg);

  const ci=h('textarea','field');ci.placeholder=cpCierreAuto(c);ci.value=c.cierre||'';ci.oninput=()=>{c.cierre=ci.value;up()};row('Cierre',ci,'Vacío = texto de cierre de siempre');

async function cpLoad(){
  const t=cotTeam();if(!t||!sb)return;
  const {data,error}=await sb.from('cot_config').select('key,data').eq('team',t.id).like('key','carta/%');
  if(error){cpHist(error);return}
  CP.list=(data||[]).map(r=>r.data).filter(x=>x&&!x.borrada).sort((a,b)=>String(b.num).localeCompare(String(a.num)));cpHist();
}
function cpHist(err){
  const box=CPV.querySelector('.cp-hist');box.innerHTML='';box.append(h('div','cp-l','Cartas anteriores'));
  if(err){box.append(h('small','cp-h',/cot_config|relation|schema/i.test(String(err.message))?'Falta el paso de la base de datos (código 5 en Supabase)':'No se pudo cargar: '+cpEsc(err.message)));return}
  if(!CP.list.length){box.append(h('small','cp-h','Todavía no hay cartas. Las que guardes aparecerán aquí, para ti y para Kimberly.'));return}
  CP.list.forEach(x=>{
    const r=h('div','cp-it'+(CP.c&&CP.c.num===x.num?' on':''));
    const info=h('button','cp-inf',`<b>${cpEsc(x.num)}</b><span>${cpEsc(cpDest(x))}</span><small>${cpEsc(cpFecha(x.fecha).replace('Lima, ',''))}${x.autor?' · '+cpEsc(x.autor):''}</small>`);
    info.onclick=()=>{CP.c=JSON.parse(JSON.stringify(x));cpForm();cpPrev();cpHist()};
    const pdf=h('button','btn sm','PDF');pdf.onclick=()=>cartaPDF(x);
    const del=h('button','btn sm ghost','Borrar');del.onclick=async()=>{if(!del.dataset.ok){del.dataset.ok=1;del.textContent='¿Seguro?';setTimeout(()=>{delete del.dataset.ok;del.textContent='Borrar'},3000);return}
      const r2=await sb.from('cot_config').update({data:Object.assign({},x,{borrada:true,borradaPor:pname(ME),actualizado:Date.now()})}).eq('team',cotTeam().id).eq('key','carta/'+x.num);if(r2.error){toast('No se pudo borrar');return}
      if(CP.c&&CP.c.num===x.num){CP.c=cpNew();cpForm();cpPrev()}cpLoad()};
    r.append(info,pdf,del);box.append(r);
  });
}
async function cpSave(pdf){
  if(CP.busy)return;const t=cotTeam(),c=CP.c;if(!t||!sb){toast('Sin conexión con el equipo de Arquizo');return}
  if(c.tipo==='empresa'?!String(c.razon||'').trim():!String(c.nombre||'').trim()){toast(c.tipo==='empresa'?'Falta la razón social':'Falta el nombre de la persona');return}
  CP.busy=true;
  try{
    c.actualizado=Date.now();c.editadoPor=pname(ME);if(!c.autor){c.autor=pname(ME);c.autorId=ME;c.creado=Date.now()}
    if(c.num){const r=await sb.from('cot_config').update({data:c}).eq('team',t.id).eq('key','carta/'+c.num);if(r.error)throw r.error}
    else{
      const y=(c.fecha||cpHoy()).slice(0,4);
      const {data,error}=await sb.from('cot_config').select('key').eq('team',t.id).like('key','carta/CP-'+y+'-%');if(error)throw error;
      let n=Math.max(0,...(data||[]).map(r=>parseInt(String(r.key).split('-').pop(),10)||0))+1,ok=false;
      for(let i=0;i<8&&!ok;i++,n++){c.num='CP-'+y+'-'+String(n).padStart(3,'0');
        const r=await sb.from('cot_config').insert({team:t.id,key:'carta/'+c.num,data:c});
        if(!r.error)ok=true;else if(!/duplicate|unique|23505|conflict/i.test(String(r.error.message)+r.error.code)){delete c.num;throw r.error}}
      if(!ok){delete c.num;throw new Error('No se pudo asignar número')}
    }
    cpForm();cpPrev();await cpLoad();
    if(pdf)await cartaPDF(c);else toast('Carta '+c.num+' guardada');
  }catch(e){toast(/cot_config|relation|schema/i.test(String(e&&e.message))?'Falta el paso de la base de datos (código 5 en Supabase)':'No se pudo guardar: '+(e&&e.message||e))}
  finally{CP.busy=false}
}
async function cartaPDF(c){
  const area=$('#printArea');area.innerHTML='';const host=h('div');area.append(host);
  host.attachShadow({mode:'open'}).innerHTML=`<style>${CP_CSS}:host{display:block}</style>${cartaPage(c)}`;
  const pg=h('style');pg.id='cpPage';pg.textContent='@page{size:A4 portrait;margin:0}';document.head.append(pg);
  document.body.classList.add('printing');
  const fn=('Carta '+(c.num||'')+' - '+cpDest(c)).replace(/[\\/:*?"<>|]+/g,' ').trim()+'.pdf';
  try{
    await Promise.all([...host.shadowRoot.querySelectorAll('img')].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
    try{await document.fonts.ready}catch(e){}
    if(window.kivo&&kivo.savePDF){const r=await kivo.savePDF(fn,{portrait:true});if(r&&r.ok)toast('PDF guardado'+(r.path?' en '+r.path:''));else if(r&&r.error)toast('No se pudo guardar el PDF');return}
    if(IS_APP){toast('En el celular, descarga el PDF desde la compu');return}
    window.print();
  }finally{setTimeout(()=>{document.body.classList.remove('printing');area.innerHTML='';pg.remove()},400)}
}

  if(AR.err){g.append(h('div','ar-empty','<b>No se pudieron cargar los archivos</b><span>'+esc(AR.err.message||'')+'</span>'));return}
  AR.fails.forEach((m,i)=>{const e=h('div','ar-card ar-fail',`<div class="ar-inf"><b>No se subió: ${esc(m.n)}</b><small>${esc(m.why)}</small></div>`);const ok=h('button','btn sm','Entendido');ok.onclick=()=>{AR.fails.splice(i,1);arRender()};e.append(ok);g.append(e)});
  if(AR.up){const u=h('div','ar-card up',`<span class="ar-ic" style="--c:#8a93a0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 16V5M7.5 9.5 12 5l4.5 4.5M5 19h14"/></svg></span><div class="ar-inf"><b>${esc(AR.up)}</b><small>Subiendo… ${AR.pct||0}%</small></div>`);g.append(u)}

    const b=h('button','btn primary','＋ Agregar archivos');b.onclick=()=>ARV.inp.click();e.append(b);g.append(e);return}
  AR.list.forEach(a=>{
    const c=h('div','ar-card');

    top.onclick=()=>arOpen(a,false);
    const acts=h('div','ar-acts');
    const o=h('button','btn sm','Abrir');o.onclick=()=>arOpen(a,false);
    const d=h('button','btn sm','Descargar');d.onclick=()=>arOpen(a,true);
    const x=h('button','btn sm ghost','Borrar');x.onclick=async()=>{if(!x.dataset.ok){x.dataset.ok=1;x.textContent='¿Seguro?';setTimeout(()=>{delete x.dataset.ok;x.textContent='Borrar'},3000);return}arDelete(a)};
    acts.append(o,d,x);c.append(top,acts);g.append(c);
  });

async function arUpload(files){
  const t=cotTeam();if(!t||!sb){toast('Sin conexión con el equipo de Arquizo');return}
  if(AR.busy){toast('Espera a que termine la subida anterior');return}
  AR.busy=true;let ok=0;
  try{
    for(const f of files){
      if(f.size>AR_MAX){AR.fails.push({n:f.name,why:'Pesa '+fmtSize(f.size)+'. El máximo es 500 MB.'});continue}
      AR.up=f.name;AR.pct=0;arRender();
      const id=uid(),base=t.id+'/'+id+'-'+safeName(f.name),n=Math.max(1,Math.ceil(f.size/AR_PART)),parts=[];let bad=null;
      for(let i=0;i<n;i++){const path=n>1?base+'.parte'+(i+1):base;
        const up=await sb.storage.from('equipo').upload(path,n>1?f.slice(i*AR_PART,(i+1)*AR_PART,f.type||'application/octet-stream'):f,{contentType:f.type||'application/octet-stream',upsert:false});
        if(up.error){bad=String(up.error.message||up.error);break}parts.push(path);AR.pct=Math.round((i+1)/n*100);arRender()}
      if(bad){if(parts.length)try{await sb.storage.from('equipo').remove(parts)}catch(e){}
        AR.fails.push({n:f.name,why:/bucket|not found|row-level|security|policy|403/i.test(bad)?'Falta el paso 6 de la base de datos en Supabase.':/exceed|too large|413|size/i.test(bad)?'Supabase no acepta un archivo tan grande ('+fmtSize(f.size)+').':'Error: '+bad});continue}
      const path=parts[0];
      const meta={id,nombre:f.name,path,parts:n>1?parts:undefined,size:f.size,type:f.type||'',autor:pname(ME),autorId:ME,subido:Date.now()};
      const r=await sb.from('cot_config').insert({team:t.id,key:'archivo/'+id,data:meta});
      if(r.error){await sb.storage.from('equipo').remove(parts);AR.fails.push({n:f.name,why:'No se pudo registrar: '+(r.error.message||'')});continue}
      AR.list.push(meta);ok++;renderDock();
    }
  }finally{AR.busy=false;AR.up=null;arRender()}
  if(ok)toast(ok>1?ok+' archivos subidos para todo el equipo':'Archivo subido para todo el equipo');if(AR.fails.length)toast('Algunos archivos no se subieron. Mira el motivo en Archivos.');
  arLoad();
}
async function arBytes(a){const bl=[];for(const p of (a.parts||[a.path])){const {data,error}=await sb.storage.from('equipo').download(p);if(error||!data)throw error||new Error('sin datos');bl.push(data)}return new Blob(bl,{type:a.type||'application/octet-stream'})}
const arIsPdf=a=>/pdf/.test(a.type||'')||/\.pdf$/i.test(a.nombre||'');
const arIsImg=a=>/^image\//.test(a.type||'')||/\.(png|jpe?g|webp|gif)$/i.test(a.nombre||'');
async function arDownload(a,blob){
  if(IS_APP){if(a.parts){toast('Este archivo es muy pesado para descargarse en la tableta; puedes verlo aquí mismo');return}
    const {data}=await sb.storage.from('equipo').createSignedUrl(a.path,3600,{download:a.nombre});if(data)window.open(data.signedUrl,'_blank');return}
  try{blob=blob||await arBytes(a)}catch(e){toast('No se pudo descargar');return}
  const url=URL.createObjectURL(blob);const x=h('a');x.href=url;x.download=a.nombre;document.body.append(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
}
async function arOpen(a,download){
  if(arOpen.busy===a.id)return;arOpen.busy=a.id;setTimeout(()=>{if(arOpen.busy===a.id)arOpen.busy=null},1500);
  if(download){arDownload(a);return}
  if(!arIsPdf(a)&&!arIsImg(a)){const {data,error}=await sb.storage.from('equipo').createSignedUrl(a.path,3600);if(error||!data){toast('No se pudo abrir el archivo');return}window.open(data.signedUrl,'_blank');return}
  arViewer(a);
}
let PDFJS=null;
async function loadPdfJs(){
  if(PDFJS)return PDFJS;
  await new Promise((ok,ko)=>{const sc=document.createElement('script');sc.src='vendor/pdf.min.js';sc.onload=ok;sc.onerror=()=>ko(new Error('No se encontró el visor de PDF'));document.head.append(sc)});
  const lib=window.pdfjsLib;if(!lib)throw new Error('Visor de PDF no disponible');
  let src='vendor/pdf.worker.min.js';
  try{const r=await fetch(window.kivo&&kivo.desktop?RES+'pdf.worker.min.js':'vendor/pdf.worker.min.js');if(r.ok)src=URL.createObjectURL(new Blob([await r.text()],{type:'text/javascript'}))}catch(e){}
  lib.GlobalWorkerOptions.workerSrc=src;PDFJS=lib;return lib;
}
async function arViewer(a){
  document.querySelectorAll('.arviewer').forEach(x=>x.close?x.close():x.remove());
  const v=h('div','cotv arviewer');v.style.display='flex';
  const hd=h('div','cotv-h');const bk=h('button','btn','‹ Volver');
  const ttl=h('b','pv-t',esc(a.nombre));const pg=h('small','pv-pg','');
  const zo=h('button','btn sm','−'),zi=h('button','btn sm','＋');zo.title='Alejar';zi.title='Acercar';
  const dl=h('button','btn','Descargar');
  hd.append(bk,ttl,h('span','grow'),pg,zo,zi,dl);
  const body=h('div','pv-body');const msg=h('div','pv-msg','<span class="pv-spin"></span>Abriendo «'+esc(a.nombre)+'»…');body.append(msg);
  v.append(hd,body);document.body.append(v);document.body.classList.add('cot-open');
  let blob=null,url=null,doc=null,zoom=1,io=null,pages=[],dead=false;
  v.close=()=>{dead=true;try{io&&io.disconnect()}catch(e){}try{doc&&doc.destroy()}catch(e){}if(url)URL.revokeObjectURL(url);v.remove();if(!((COTV&&COTV.style.display==='flex')||(CPV&&CPV.style.display==='flex')||(ARV&&ARV.style.display==='flex')))document.body.classList.remove('cot-open')};
  bk.onclick=()=>v.close();
  dl.onclick=()=>arDownload(a,blob);
  try{blob=await arBytes(a)}catch(e){msg.innerHTML='No se pudo abrir el archivo. Revisa tu internet.';return}
  if(dead)return;
  if(arIsImg(a)){url=URL.createObjectURL(blob);msg.remove();zo.remove();zi.remove();const im=h('img','pv-img');im.src=url;body.append(im);return}
  try{const lib=await loadPdfJs();doc=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise}
  catch(e){msg.innerHTML='No se pudo mostrar el PDF ('+esc(e&&e.message||e)+'). Puedes descargarlo.';return}
  if(dead)return;msg.remove();
  const n=doc.numPages;pg.textContent=n+(n===1?' página':' páginas');
  const first=await doc.getPage(1);const base=first.getViewport({scale:1});
  for(let i=1;i<=n;i++){const d=h('div','pv-page');d.dataset.n=i;pages.push(d);body.append(d)}
  const avail=()=>Math.max(200,body.clientWidth-(innerWidth<600?16:48));
  const layout=()=>{const w=Math.min(avail(),1100)*zoom;pages.forEach(d=>{const r=d.ratio||base.height/base.width;d.style.width=w+'px';d.style.height=w*r+'px'})};
  const drop=d=>{const c=d.querySelector('canvas');if(c){c.width=0;c.height=0;c.remove()}d.done=0};
  const draw=async d=>{const want=d.style.width;if(d.done===want||d.busy)return;d.busy=1;
    try{const p=await doc.getPage(+d.dataset.n);const vp1=p.getViewport({scale:1});d.ratio=vp1.height/vp1.width;const w=parseFloat(d.style.width);d.style.height=w*d.ratio+'px';
      const dpr=Math.min(2,window.devicePixelRatio||1);const vp=p.getViewport({scale:w/vp1.width*dpr});
      const c=document.createElement('canvas');c.width=Math.floor(vp.width);c.height=Math.floor(vp.height);
      await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;if(dead)return;
      const old=d.querySelector('canvas');if(old){old.width=0;old.remove()}d.append(c);d.done=want}catch(e){}finally{d.busy=0}};
  const vis=new Set();
  io=new IntersectionObserver(es=>{es.forEach(e=>{const d=e.target;if(e.isIntersecting){vis.add(d);draw(d)}else{vis.delete(d)}});
    const ids=[...vis].map(d=>+d.dataset.n);if(ids.length){const lo=Math.min(...ids),hi=Math.max(...ids);pg.textContent='Página '+lo+' de '+n;
      pages.forEach(d=>{const k=+d.dataset.n;if(k<lo-3||k>hi+3)drop(d)})}},{root:body,rootMargin:'600px 0px'});
  layout();pages.forEach(d=>io.observe(d));
  const rez=()=>{layout();[...vis].forEach(draw)};
  zo.onclick=()=>{zoom=Math.max(.5,+(zoom-.25).toFixed(2));rez()};zi.onclick=()=>{zoom=Math.min(3,+(zoom+.25).toFixed(2));rez()};
  new ResizeObserver(()=>{if(!dead)rez()}).observe(body);
}
async function arDelete(a){

  const r=await sb.from('cot_config').update({data:Object.assign({},a,{borrado:true,borradoPor:pname(ME)})}).eq('team',t.id).eq('key','archivo/'+a.id);
  if(r.error){toast('No se pudo borrar');return}

}

function dataToBlob(d){const i=d.indexOf(',');const mime=d.slice(5,i).split(';')[0]||'application/octet-stream';const bin=atob(d.slice(i+1));const u=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)u[k]=bin.charCodeAt(k);return new Blob([u],{type:mime})}

async function importOld(o){
  const d=o.data||o;if(!Array.isArray(d.tasks))throw 0;
  const oldLists=d.lists||[];const map={};
  oldLists.forEach(ol=>{let nl=S.lists.find(l=>norm(l.name)===norm(ol.name));if(!nl){nl={id:uid(),name:ol.name||'Lista',emoji:ol.emoji||'📁',color:ol.color||'#e8590c',owner:ME};S.lists.push(nl)}map[ol.id]=nl.id});
  const files=o.files||{};const later=[];
  const nt=d.tasks.map(t=>{
    const x=fixTask({text:t.text||'',emoji:t.emoji||'',list:map[t.list]||'',date:t.date||'',time:t.time||'',remind:t.remind||'10',repeat:t.repeat||'',star:!!t.star,status:t.status||(t.done?'done':'todo'),progress:t.progress||(t.status==='done'||t.done?100:0),subtasks:(t.subtasks||[]).map(s=>({id:uid(),text:s.text,done:!!s.done})),notes:t.notes||'',doneNote:t.doneNote||'',mood:t.mood||'',doneAt:t.doneAt||null,doneOn:t.doneOn||null,doneBy:(t.status==='done'||t.done)?ME:null,at:t.at||Date.now(),ord:t.ord==null?null:t.ord,contact:t.contact||null,spawned:!!t.spawned,owner:ME,attach:[]});
    (t.attach||[]).forEach(a=>{if(files[a.id])later.push({x,a,data:files[a.id]})});
    return x;
  });
  if(!confirm('Se agregarán '+nt.length+' tareas'+(later.length?' y '+later.length+' archivos':'')+' de tu versión anterior. ¿Continuar?'))return;
  S.tasks.push(...nt);(d.contacts||[]).forEach(c=>rememberContact(c));save();renderAll();
  await flush();
  if(later.length){toast('Subiendo '+later.length+' archivos…');for(const {x,a,data} of later){try{const b=dataToBlob(data);const up=await uploadBlob(x.id,a.name,b);if(up){up.type=a.type||b.type;x.attach.push(up)}}catch(e){}}save()}
  toast('¡Listo! Se agregaron '+nt.length+' tareas 🎉');
}

function authErr(e){const m=String((e&&e.message)||e||'');
  if(/invalid login/i.test(m))return 'Correo o contraseña incorrectos.';
  if(/already registered|already been registered/i.test(m))return 'Ese correo ya tiene una cuenta. Usa «Entrar».';
  if(/not confirmed/i.test(m))return 'Primero confirma tu correo (revisa tu bandeja de entrada o spam).';
  if(/password/i.test(m)&&/6/.test(m))return 'La contraseña debe tener al menos 6 caracteres.';
  if(/rate limit|too many/i.test(m))return 'Demasiados intentos. Espera un minuto y vuelve a intentar.';
  if(/fetch|network/i.test(m))return 'Sin conexión a internet.';
  if(/valid email|invalid email/i.test(m))return 'Escribe un correo válido.';
  return m||'Algo salió mal. Intenta otra vez.'}
function showAuth(mode,msg){
  mode=mode||'in';const a=$('#auth');a.style.display='flex';a.innerHTML='';$('#app').style.display='none';
  const card=h('div','auth-card');
  card.innerHTML='<img class="auth-logo-img" src="icons/kivo.svg" alt="Kivo"><h1>Kivo</h1><p class="muted2">Tus tareas y las de tu equipo, siempre al día.</p>';
  if(mode==='in'||mode==='up'){const tabs=h('div','seg');[['in','Entrar'],['up','Crear cuenta']].forEach(([k,l])=>{const b=h('button',mode===k?'on':'',l);b.type='button';b.onclick=()=>showAuth(k);tabs.append(b)});card.append(tabs)}
  if(mode==='reset')card.append(h('p','small-note','Escribe tu correo y te enviamos un enlace para crear una contraseña nueva.'));
  const f=h('form','auth-form');
  const nm=h('input','field');nm.placeholder='Tu nombre';nm.autocomplete='name';
  const em=h('input','field');em.type='email';em.placeholder='Correo';em.autocomplete='email';em.required=true;
  const pw=h('input','field');pw.type='password';pw.placeholder=mode==='up'?'Contraseña (mínimo 6 caracteres)':'Contraseña';pw.autocomplete=mode==='up'?'new-password':'current-password';pw.required=true;
  if(mode==='up')f.append(nm);f.append(em);if(mode!=='reset')f.append(pw);
  const err=h('div','auth-msg'+(msg&&msg.ok?' ok':''),msg?esc(msg.text||msg):'');
  const go=h('button','btn primary',mode==='up'?'Crear mi cuenta':mode==='reset'?'Enviarme el enlace':'Entrar');go.type='submit';
  f.append(err,go);
  f.onsubmit=async e=>{
    e.preventDefault();err.textContent='';err.className='auth-msg';go.disabled=true;const old=go.textContent;go.textContent='Un momento…';
    try{
      if(mode==='in'){const {error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(error)throw error}
      else if(mode==='up'){
        if(pw.value.length<6)throw {message:'password 6'};
        const {data,error}=await sb.auth.signUp({email:em.value.trim(),password:pw.value,options:{data:{name:nm.value.trim()},emailRedirectTo:appURL()||undefined}});
        if(error)throw error;
        if(!data||!data.session){err.className='auth-msg ok';err.textContent='¡Cuenta creada! Te enviamos un correo para confirmarla. Ábrelo y luego entra aquí.'}
      }else{
        const {error}=await sb.auth.resetPasswordForEmail(em.value.trim(),{redirectTo:appURL()||undefined});if(error)throw error;
        err.className='auth-msg ok';err.textContent='Listo. Revisa tu correo y abre el enlace.';
      }
    }catch(x){err.textContent=authErr(x)}finally{go.disabled=false;go.textContent=old}
  };
  card.append(f);
  if(mode==='in'){const fg=h('button','linkbtn','¿Olvidaste tu contraseña?');fg.onclick=()=>showAuth('reset');card.append(fg)}
  if(mode==='reset'){const bk=h('button','linkbtn','← Volver');bk.onclick=()=>showAuth('in');card.append(bk)}
  a.append(card);setTimeout(()=>{try{(mode==='up'?nm:em).focus()}catch(e){}},60);
}

  const k=h('input','field');k.placeholder='Clave anon / publishable';

  f.append(u,k,go);f.onsubmit=e=>{e.preventDefault();const c={url:u.value.trim().replace(/\/+$/,''),key:k.value.trim()};try{localStorage.setItem('kivo-cfg',JSON.stringify(c))}catch(x){}location.reload()};
  card.append(f);a.append(card);
}

/* ---- arranque ---- */
async function start(session){
  if(!session||!session.user||ME===session.user.id)return;
  ME=session.user.id;MYEMAIL=session.user.email||'';KEY='kivo-v1-'+ME;
  load();try{SYNC=JSON.parse(localStorage.getItem(KEY+'-sync')||'null')||{tasks:{},lists:{}}}catch(e){SYNC={tasks:{},lists:{}}}
  S.onboarded=true;const meta=session.user.user_metadata||{};if(!S.name&&meta.name)S.name=meta.name;
  MEMBERS[ME]={id:ME,name:S.name,email:MYEMAIL,color:S.accent};
  $('#auth').style.display='none';$('#app').style.display='';
  resetDraft();fillDL();renderAll();lastJ=snapJ();setSync('busy');
  try{await fetchAll();READY=true;renderAll();subscribe();await flush();
    if(!S.seeded){if(S.lists.some(l=>l.owner===ME))S.seeded=true;else firstRun()}
  }catch(e){console.warn(e);READY=true;setSync('err');setTimeout(()=>fetchAll().then(()=>{renderAll();if(!CH)subscribe();flush()}).catch(()=>{}),15000)}
  if(!IS_APP)$('#txt').focus();setTimeout(tick,1500);
  if(IS_APP){nativeSetup();checkApkUpdate()}
}
function boot(){
  $('#searchBtn').innerHTML=ICO.search;$('#statsBtn').innerHTML=ICO.chart;$('#gear').innerHTML=ICO.gear;$('#mic').innerHTML=ICO.mic;
  if(IS_APP){if(!KNAT())$('#printBtn').style.display='none';const wo=window.open.bind(window);window.open=(u,t,f)=>{if(/^(https?|mailto|tel|whatsapp):/i.test(String(u||''))&&!/^https?:\/\/localhost/.test(u)){location.href=u;return null}return wo(u,t,f)}}
  if(!IS_APP&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFERRED=e;if(ME)renderBanner()});
  S=defaults();applyLook();
  if(window.__PENDIENTES_MOCK__)sb=window.__PENDIENTES_MOCK__;
  else{
    const cfg=getConfig();if(!cfg){showSetup();return}
    if(!window.supabase||!window.supabase.createClient){const a=$('#auth');a.style.display='flex';a.innerHTML='<div class="auth-card"><div class="auth-logo">😕</div><h1>Sin conexión</h1><p class="muted2">No se pudo cargar Kivo. Revisa tu internet y vuelve a abrir.</p><button class="btn primary" onclick="location.reload()">Reintentar</button></div>';return}
    sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  }
  sb.auth.onAuthStateChange((ev,session)=>{
    setTimeout(()=>{
      if(ev==='PASSWORD_RECOVERY'){if(session)start(session).then(newPassword);else newPassword();return}
      if(ev==='SIGNED_OUT'){if(ME)location.reload();else showAuth('in');return}
      if(session)start(session);
    },0);
  });
  if(window.kivo){const v=document.createElement('style');v.textContent='.hint{display:none}';document.head.append(v)}
  sb.auth.getSession().then(({data})=>{if(data&&data.session)start(data.session);else if(!ME)showAuth('in')}).catch(()=>showAuth('in'));
  window.addEventListener('online',()=>{if(ME&&READY){fetchAll().then(renderAll).catch(()=>{});flush()}});
  setInterval(()=>{if(!ME)return;checkDay();tick();try{schedTick()}catch(e){console.warn(e)}renderHeader()},20000);
  setTimeout(()=>{try{renderPill();schedTick()}catch(e){console.warn(e)}},1500);
}

/* ---------- arranque ---------- */
/* ================= Kivo 1.2: listas al costado, agrupadas por tipo ================= */
const CATS=[
  {id:'emp',n:'Empresas',svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="7.5" width="18" height="12.5" rx="2.5"/><path d="M9 7.5V5.5a1.5 1.5 0 0 1 1.5-1.5h3A1.5 1.5 0 0 1 15 5.5v2M3 13h18"/></svg>'},
  {id:'per',n:'Personal',svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11.5 12 5l8 6.5V20h-5.5v-5h-5v5H4z"/></svg>'},
  {id:'esc',n:'Escritura',svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M15.5 4.5l4 4L9 19H5v-4z"/><path d="M13 7l4 4"/></svg>'},
  {id:'est',n:'Estudios',svg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2.5 9 12 4.5 21.5 9 12 13.5z"/><path d="M6.5 11v4.5c0 1.5 2.5 3 5.5 3s5.5-1.5 5.5-3V11M21.5 9v5"/></svg>'}
];
const PALETTE=['#CF0100','#e8590c','#e3a008','#2f9e5b','#0f8a8a','#2c5cc5','#5856d6','#8a46c8','#d6336c','#8e8e93','#02192E','#1d1d1f'];
// reconoce el tipo de una lista por su tipo de espacio y su nombre
function guessCat(name,kind){
  if(kind==='writer')return 'esc';if(kind==='student'||kind==='course')return 'est';if(kind==='personal')return 'per';
  if(['arch','community','creator','design','shop','teach'].includes(kind))return 'emp';
  const x=' '+norm(name||'')+' ';
  if(/\b(s\.?a\.?c\.?|e\.?i\.?r\.?l\.?|s\.?a\.?|empresa|estudio|tienda|negocio|marca|clientes?|ventas|agencia|academia|inmobiliaria|consultora|taller de|store|shop)\b/.test(x)||(typeof cotTeam==='function'&&false))return 'emp';
  if(/(novela|libro|cuento|poema|poesia|escrit|capitulo|blog|guion|saga|manuscrito)/.test(x))return 'esc';
  if(/(curso|tesis|universidad|\buni\b|clases?\b|maestria|diplomado|examen|estudi|certificacion|ingles|idioma|carrera|ciclo)/.test(x))return 'est';
  return 'per';
}
function catOf(l){const m=metaOf(l);if(m.cat&&CATS.some(c=>c.id===m.cat))return m.cat;const t=cotTeam();if(t&&t.id===l.id)return 'emp';return guessCat(l.name,l.kind)}
// reconoce a qué lista va una tarea (solo si no elegiste lista)
const KIND_KW={arch:/(cotiza|presupuest|cliente|plano|obra|render|levantamiento|brochure|portafolio|carta de presentacion)/,shop:/(pedido|tazas?|polos?|sublima|envio|stock|delivery)/,writer:/(capitulo|novela|escena|personaje|manuscrito|editorial|isbn)/,
  student:/(tarea del|examen|exposicion|practica calificada|tesis|monografia|silabo)/,course:/(modulo|leccion|tarea del curso|certificado)/,creator:/(video|live|reel|miniatura|grabar|edicion|youtube|tiktok)/,
  teach:/(alumnos?|sesion|clase de)/,personal:/(pagar|comprar|medico|dentista|doctor|cita medica|banco|recibo|cumpleanos|mama|papa|gimnasio)/,community:/(post|publicacion|historia de instagram|programar post)/,design:/(logo|flyer|boceto|identidad)/};
function guessList(text){
  const x=' '+norm(text||'')+' ';if(x.trim().length<4)return null;
  const byName=S.lists.filter(l=>{const w=norm(l.name).split(/\s+/).filter(t=>t.length>=4&&!/^(lista|mis?|para|cosas|personal)$/.test(t));return w.some(t=>new RegExp('(^|[^a-z0-9])'+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)').test(x))});
  if(byName.length===1)return byName[0].id;
  const byKind=S.lists.filter(l=>KIND_KW[l.kind]&&KIND_KW[l.kind].test(x));
  if(byKind.length===1)return byKind[0].id;
  return null;
}
const SIDEW=1240;
function sideOn(){return innerWidth>=SIDEW&&!!ME}
function renderSide(){
  let sd=$('#lside');
  if(!sideOn()){if(sd)sd.remove();document.body.classList.remove('has-side');return}
  document.body.classList.add('has-side');
  if(!sd){sd=h('aside','lside');sd.id='lside';sd.setAttribute('aria-label','Mis listas');document.body.append(sd)}
  const op=open(),t=today();sd.innerHTML='';
  const row=(l,all)=>{
    const id=all?'all':l.id,mine=op.filter(x=>all||x.list===l.id),on=S.filter===id;
    const d=h('div','ls-i'+(on?' on':'')+(SIDEFRESH===id?' fresh':''));
    const ico=all?`<span class="ls-dot all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg></span>`:`<span class="ls-dot" role="button" tabindex="0" title="Cambiar color o tipo" style="--lc:${esc(l.color||'#8e8e93')}">${iconHTML(l.emoji)||esc((l.name||'?')[0])}</span>`;
    const hd=h('div','ls-h',`${ico}<b>${all?'Todo':esc(l.name)}${!all&&isShared(l.id)?`<small>${IC_USERS} Equipo</small>`:''}</b><span class="ls-n">${mine.length||''}</span>`);
    hd.setAttribute('role','button');hd.tabIndex=0;hd.title=all?'Ver todo':'Ver '+l.name;
    hd.onclick=e=>{if(e.target.closest('.ls-dot:not(.all)'))return;S.filter=id;save();renderAll()};
    hd.onkeydown=e=>{if(e.key==='Enter'){S.filter=id;save();renderAll()}};
    d.append(hd);
    if(!all){
      const dot=hd.querySelector('.ls-dot');dot.onclick=e=>{e.stopPropagation();sidePalette(l,dot)};dot.onkeydown=e=>{if(e.key==='Enter'){e.stopPropagation();sidePalette(l,dot)}};
      if(on){const pk=h('div','ls-peek');const ps=mine.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'99').localeCompare(b.time||'99'));
        ps.slice(0,4).forEach(x=>{const late=x.date&&x.date<t;pk.append(h('div','ls-pk'+(late?' late':''),`<span>${esc(x.text)}</span><time>${x.date?esc(late?'Atrasada':fmtDate(x.date)):''}</time>`))});
        if(ps.length>4)pk.append(h('div','ls-pk more','y '+(ps.length-4)+' más'));if(!ps.length)pk.append(h('div','ls-pk more','Nada pendiente'));d.append(pk)}
    }
    return d;
  };
  sd.append(row(null,true));
  if(teammates().length){const m=h('button','ls-mine'+(S.mine?' on':''),(S.mine?'✓ ':'')+'Solo lo mío');m.title='Solo lo que me toca a mí';m.onclick=()=>{S.mine=!S.mine;save();renderAll()};sd.append(m)}
  const shut=new Set(S.shutCats||[]);
  CATS.forEach(c=>{const ls=S.lists.filter(l=>catOf(l)===c.id);if(!ls.length)return;
    const closed=shut.has(c.id),n=op.filter(x=>ls.some(l=>l.id===x.list)).length;
    const g=h('button','ls-g'+(closed?' shut':''),`<span class="tri"><svg viewBox="0 0 10 10"><path d="M3 1.5 7.5 5 3 8.5z" fill="currentColor"/></svg></span><span class="gi">${c.svg}</span>${c.n}<span class="gc">${n||''}</span>`);
    g.setAttribute('aria-expanded',String(!closed));g.title=(closed?'Mostrar ':'Ocultar ')+c.n;
    g.onclick=()=>{const s=new Set(S.shutCats||[]);s.has(c.id)?s.delete(c.id):s.add(c.id);S.shutCats=[...s];save();renderSide()};sd.append(g);
    if(!closed)ls.forEach(l=>sd.append(row(l)));
  });
  const nb=h('button','ls-new','<span>+</span>Nueva lista');nb.onclick=()=>openListEditor();sd.append(nb);
  SIDEFRESH=null;
}
let SIDEFRESH=null;
function closeSidePal(){document.querySelectorAll('.ls-pal').forEach(x=>x.remove())}
function sidePalette(l,anchor){
  closeSidePal();const p=h('div','ls-pal');const r=anchor.getBoundingClientRect();
  p.style.left=Math.min(r.left,innerWidth-250)+'px';p.style.top=Math.min(r.bottom+8,innerHeight-300)+'px';
  const cat=catOf(l);
  p.innerHTML=`<b>Etiqueta de «${esc(l.name)}»</b><div class="sw">${PALETTE.map(c=>`<button style="background:${c}" class="${String(l.color).toLowerCase()===c.toLowerCase()?'on':''}" data-c="${c}" aria-label="Color ${c}"></button>`).join('')}</div>
  <label class="cc"><input type="color" value="${/^#[0-9a-f]{6}$/i.test(l.color||'')?l.color:'#8e8e93'}"> Otro color</label><b>Tipo</b><div class="cats">${CATS.map(c=>`<button data-k="${c.id}" class="${cat===c.id?'on':''}">${c.n}</button>`).join('')}</div><button class="btn ls-edit">Editar lista…</button>`;
  p.querySelectorAll('.sw button').forEach(b=>b.onclick=()=>{l.color=b.dataset.c;save();renderAll();closeSidePal()});
  const cc=p.querySelector('input[type=color]');cc.oninput=()=>{l.color=cc.value;renderSide();renderList()};cc.onchange=()=>{l.color=cc.value;save();renderAll()};
  p.querySelectorAll('.cats button').forEach(b=>b.onclick=()=>{metaOf(l).cat=b.dataset.k;save();renderAll();closeSidePal();toast('«'+l.name+'» ahora está en '+CATS.find(c=>c.id===b.dataset.k).n)});
  p.querySelector('.ls-edit').onclick=()=>{closeSidePal();openListEditor(l)};
  p.addEventListener('click',e=>e.stopPropagation());document.body.append(p);
}
document.addEventListener('click',e=>{if(!e.target.closest('.ls-pal'))closeSidePal()});
addEventListener('resize',()=>{clearTimeout(renderSide.t);renderSide.t=setTimeout(()=>{renderSide();renderList()},150)});

function renderAll(){applyLook();renderHeader();renderAdd();renderList();try{cotAutoFlag();renderDock()}catch(e){console.warn(e)}}
let lastDay=today();
function checkDay(){if(today()!==lastDay){lastDay=today();if(D.date<today())D.date=today();renderAll()}}
$('#txt').addEventListener('input',renderAdd);
$('#txt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addTask()}});
$('#go').onclick=addTask;
$('#emoBtn').onclick=()=>emojiPicker(e=>{D.emoji=e;renderAdd();$('#txt').focus()},true);
$('#gear').onclick=()=>openSettings();
$('#searchBtn').onclick=openSearch;
$('#aiBtn').onclick=openAI;
$('#printBtn').onclick=openPrint;
$('#statsBtn').onclick=()=>{statsOff=0;openStats()};
$('#mic').onclick=toggleMic;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;save();renderList()});
document.addEventListener('keydown',e=>{
  if(!ME)return;
  if(e.key==='Escape'&&MODALS.length){closeModal();return}
  if((e.ctrlKey||e.metaKey)&&!e.altKey){
    const k=e.key.toLowerCase(),ae=document.activeElement;
    if(k==='k'){e.preventDefault();if(!MODALS.length)openSearch();return}
    const typing=(/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&!(ae.id==='txt'&&!ae.value))||ae.isContentEditable;
    if(!typing&&k==='z'&&!e.shiftKey){e.preventDefault();undo();return}
    if(!typing&&(k==='y'||(k==='z'&&e.shiftKey))){e.preventDefault();redo();return}
  }
  if((e.key==='/'||e.key==='n')&&!MODALS.length&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#txt').focus()}
});
boot();
