<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kivo</title>
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kivo">
<style>
:root{--accent:#e8590c;--bg:#f6f5f2;--card:#fff;--card2:#faf9f7;--text:#24221f;--muted:#77746c;--soft:#aeaba3;--line:#ebe8e2;--late:#d9443a;--ok:#2f9e5b;--star:#e3a008;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);--a-soft:color-mix(in srgb,var(--accent) 13%,transparent);--a-mid:color-mix(in srgb,var(--accent) 40%,transparent);color-scheme:light}
:root[data-theme=dark]{--bg:#171615;--card:#22211f;--card2:#1d1c1a;--text:#eeece8;--muted:#a19e97;--soft:#6a675f;--line:#302e2b;--late:#ff6b61;--ok:#4cc27c;--shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{min-height:100%}
body{margin:0;min-height:100vh;background:var(--bg);background-attachment:fixed;color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:36px 16px 120px}
/* encabezado */
header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
h1{margin:0;font-size:30px;letter-spacing:-.02em;line-height:1.15}
.sub{color:var(--muted);font-size:15px;margin-top:5px}
.grow{flex:1}
.ringbox{position:relative;flex:none;text-align:center}
.ring{width:58px;height:58px;display:block}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring text{font-size:13px;font-weight:700;fill:var(--text)}
.streak{font-size:12px;font-weight:700;color:var(--accent);margin-top:2px;white-space:nowrap}
.iconb{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--card);box-shadow:var(--shadow)}
#gear:hover{transform:rotate(30deg)}
.iconb{transition:transform .3s,background .15s}
.iconb:hover{background:var(--a-soft)}
.hbtns{display:flex;gap:8px}
/* agregar */
.add{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:8px 8px 12px;margin-bottom:16px;border:2px solid transparent;transition:border-color .15s}
.add:focus-within{border-color:var(--accent)}
.add-row{display:flex;align-items:center;gap:6px}
.emo-btn{width:44px;height:44px;border-radius:12px;font-size:24px;line-height:1;flex:none;display:grid;place-items:center}
.emo-btn:hover{background:var(--a-soft)}
.emo-btn.noemo{filter:grayscale(1);opacity:.45}
#txt{flex:1;border:0;background:none;outline:none;font-size:18px;padding:10px 4px;min-width:0}
#txt::placeholder{color:var(--soft)}
.go{background:var(--accent);color:#fff;font-weight:650;padding:10px 16px;border-radius:12px;flex:none;font-size:15px}
.go:hover{filter:brightness(1.07)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 6px 0 54px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;background:var(--card)}
.chip:hover{border-color:var(--soft);color:var(--text)}
.chip.on{background:var(--a-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.smart{padding:8px 6px 0 54px;font-size:13px;color:var(--accent);display:none}
.smart.show{display:block}
/* aviso de permisos */
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--a-soft);border:1px solid var(--a-mid);border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:14.5px}
.banner b{flex:1;min-width:200px;font-weight:550}
.btn{padding:8px 14px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:550}
.btn:hover{border-color:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--late)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
/* pestañas y filtros */
.tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px}
.tab{flex:1;padding:9px 4px;border-radius:10px;font-size:14.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{background:var(--accent);color:#fff}
.tab .n{opacity:.75;font-weight:500;margin-left:3px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--muted);background:var(--card);box-shadow:var(--shadow);display:inline-flex;gap:6px;align-items:center}
.fchip.on{color:#fff;background:var(--fc,var(--accent))}
.fchip .c{opacity:.7;font-size:12px}
.fchip.add{background:transparent;box-shadow:none;border:1.5px dashed var(--soft);color:var(--muted)}
.fchip.add:hover{border-color:var(--accent);color:var(--accent)}
.fchip.edit{padding:5px 9px}
@media (min-width:561px){.filters{flex-wrap:wrap;overflow:visible;align-items:center;row-gap:8px}}
.fchip{line-height:1.4}
/* lista */
.sec{font-size:12.5px;font-weight:700;color:var(--muted);margin:20px 4px 8px;text-transform:uppercase;letter-spacing:.05em}
.sec.late{color:var(--late)}
.list{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 10px 11px 14px;box-shadow:var(--shadow);animation:in .22s ease-out;border-left:4px solid var(--lc,transparent);cursor:pointer;transition:transform .12s}
.task:hover{transform:translateX(2px)}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.task.leaving{transition:opacity .35s,transform .35s;opacity:0;transform:translateX(24px)}
.check{width:27px;height:27px;border-radius:50%;border:2px solid var(--soft);flex:none;display:grid;place-items:center;color:transparent;font-size:14px;font-weight:700;transition:.15s;position:relative;overflow:hidden}
.check:hover{border-color:var(--ok);color:var(--ok)}
.check.doing{border-color:var(--accent)}
.check.doing::before{content:'';position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--accent);opacity:.55}
.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.done .check::before{display:none}
.temoji{font-size:22px;flex:none;line-height:1}
.body{flex:1;min-width:0}
.t{word-break:break-word;font-weight:500}
.done .t{text-decoration:line-through;color:var(--soft)}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meta .late{color:var(--late);font-weight:650}
.meta .today{color:var(--accent);font-weight:650}
.lchip{display:inline-flex;align-items:center;gap:4px}
.badge{background:var(--a-soft);color:var(--accent);padding:0 7px;border-radius:6px;font-weight:600}
.qb{border-radius:6px;padding:0 4px;color:var(--muted)}
.qb:hover{background:var(--a-soft);color:var(--accent)}
.note-prev{font-size:13px;color:var(--muted);margin-top:4px;font-style:italic}
.star{font-size:20px;color:var(--soft);width:34px;height:34px;border-radius:9px;flex:none}
.star:hover{background:var(--card2)}
.star.on{color:var(--star)}
.empty{text-align:center;color:var(--muted);padding:36px 16px}
.empty .big{font-size:48px;margin-bottom:6px}
.donebar{margin:22px 4px 8px}
.donebar button{font-size:13.5px;color:var(--muted);padding:6px 10px;border-radius:9px;background:var(--card);box-shadow:var(--shadow)}
.hint{text-align:center;font-size:12.5px;color:var(--soft);margin-top:34px;line-height:1.7}
.hint code{background:var(--card);padding:1px 6px;border-radius:5px;color:var(--muted)}
/* ventanas */
.ov{position:fixed;inset:0;background:rgba(12,11,10,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto;animation:fade .15s}
.ov.side{padding:0;justify-content:flex-end;align-items:stretch}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:min(520px,100%);animation:pop .18s ease-out;color:var(--text)}
.modal.small{width:min(380px,100%)}
.modal.sheet{width:min(470px,100%);border-radius:18px 0 0 18px;min-height:100%;animation:slide .22s ease-out;overflow:auto;max-height:100vh}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.mpad{padding:20px 22px}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mh h2{margin:0;font-size:20px;flex:1}
.x{width:34px;height:34px;border-radius:9px;color:var(--muted);font-size:18px;flex:none}
.x:hover{background:var(--card2);color:var(--text)}
.lbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.foot{display:flex;gap:8px;align-items:center;margin-top:20px;flex-wrap:wrap}
.field{width:100%;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:9px 12px;outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{resize:vertical;min-height:90px;line-height:1.5}
select.field{cursor:pointer}
/* emojis */
.emo-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.emo-tabs button{font-size:13px;padding:4px 10px;border-radius:8px;color:var(--muted)}
.emo-tabs button.on{background:var(--a-soft);color:var(--accent);font-weight:600}
.emo-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emo-grid button{height:40px;border-radius:9px;font-size:23px}
.emo-grid button:hover{background:var(--a-soft);transform:scale(1.15)}
/* calendario elegir fecha */
.quick{display:flex;gap:6px;flex-wrap:wrap}
.calh{display:flex;align-items:center;gap:6px;margin:14px 0 6px}
.calh b{flex:1;font-size:15px}
.calh button{width:32px;height:32px;border-radius:9px;font-size:18px}
.calh button:hover{background:var(--card2)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cgrid .dw{font-size:11.5px;color:var(--soft);font-weight:700;padding:4px 0;text-transform:uppercase}
.cgrid button{height:38px;border-radius:10px;font-size:14.5px}
.cgrid button:hover{background:var(--a-soft)}
.cgrid button.out{color:var(--soft)}
.cgrid button.past{color:var(--soft)}
.cgrid button.tod{box-shadow:inset 0 0 0 2px var(--a-mid);font-weight:700}
.cgrid button.sel{background:var(--accent);color:#fff;font-weight:700}
.cgrid button.dot{position:relative}
.cgrid button.dot::after{content:'';position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.cgrid button.sel.dot::after{background:#fff}
.trow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.trow input[type=time]{width:130px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small-note{font-size:12.5px;color:var(--soft);margin-top:6px}
/* detalle */
.dtop{display:flex;gap:10px;align-items:flex-start}
.dem{width:56px;height:56px;border-radius:14px;font-size:32px;flex:none;background:var(--card2);display:grid;place-items:center}
.dem:hover{background:var(--a-soft)}
.dtitle{flex:1;border:0;background:none;outline:none;font-size:21px;font-weight:700;resize:none;padding:12px 0 0;line-height:1.3;min-height:40px;overflow:hidden}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px;margin-top:16px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:14px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.seg button.on.ok{background:var(--ok);color:#fff}
.seg button.on.doing{background:var(--accent);color:#fff}
.props{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.prop{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-align:left;font-size:15px}
.prop:hover{background:var(--card2)}
.prop .k{width:24px;text-align:center}
.prop .v{flex:1}
.prop .v small{color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:4px}
.step{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:9px}
.step:hover{background:var(--card2)}
.step .check{width:22px;height:22px;font-size:12px}
.step.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.step input{flex:1;border:0;background:none;outline:none;padding:4px 0}
.step.done input{text-decoration:line-through;color:var(--soft)}
.step .sx{opacity:0;color:var(--soft);width:26px;height:26px;border-radius:7px}
.step:hover .sx{opacity:1}
.sbar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:2px 0 8px}
.sbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.donebox{background:color-mix(in srgb,var(--ok) 10%,transparent);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);border-radius:14px;padding:14px;margin-top:18px}
.donebox .when{font-weight:650;color:var(--ok)}
.moods{display:flex;gap:6px;margin:10px 0}
.moods button{font-size:26px;width:48px;height:44px;border-radius:12px;filter:grayscale(.8);opacity:.6;transition:.15s}
.moods button:hover{opacity:1;filter:none}
.moods button.on{opacity:1;filter:none;background:var(--card);box-shadow:var(--shadow);transform:scale(1.08)}
/* ajustes */
.sw-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--text)}
.sw-custom{position:relative;overflow:hidden;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.sw-custom input{position:absolute;inset:-8px;opacity:0;cursor:pointer}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bgt{height:56px;border-radius:12px;border:2px solid var(--line);font-size:12.5px;font-weight:600;display:flex;align-items:flex-end;padding:6px 8px;color:#333}
.bgt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--a-mid)}
.lrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.lrow .le{width:40px;height:40px;border-radius:10px;font-size:20px;background:var(--card2)}
.lrow input[type=text]{flex:1}
.lrow input[type=color]{width:40px;height:40px;border:0;padding:0;background:none;border-radius:10px;cursor:pointer}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.tog{width:46px;height:27px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.tog::after{content:'';position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on{background:var(--accent)}
.tog.on::after{left:22px}
.state{font-size:13px;padding:2px 8px;border-radius:6px;background:var(--card2);color:var(--muted)}
.state.ok{color:var(--ok)}
/* alertas */
#alerts{position:fixed;top:14px;left:14px;z-index:80;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100vw - 28px))}
.al{background:var(--card);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.25);padding:14px 14px 12px;border-left:5px solid var(--accent);max-height:60vh;overflow:auto;animation:alin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes alin{from{transform:translateX(-60px);opacity:0}}
@media (max-width:900px){#alerts{left:50%;transform:translateX(-50%)}}
.al-h{display:flex;gap:8px;align-items:flex-start}
.al-h b{flex:1;font-size:15.5px;line-height:1.3}
.al p{margin:6px 0 10px;color:var(--muted);font-size:14px;white-space:pre-line}
.al .acts{display:flex;gap:6px;flex-wrap:wrap}
.al .acts .btn{padding:6px 11px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#24221f;color:#fff;padding:12px 16px;border-radius:14px;font-size:14.5px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:90;animation:tin .22s ease-out;max-width:calc(100vw - 28px)}
.toast button{color:#ffc29e;font-weight:700;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:100}
.hist-it{display:flex;gap:10px;align-items:flex-start}

/* voz */
.mic{width:44px;height:44px;border-radius:12px;font-size:20px;flex:none;display:grid;place-items:center}
.mic:hover{background:var(--a-soft)}
.mic.on{background:#e5484d;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}100%{box-shadow:0 0 0 14px rgba(229,72,77,0)}}
/* arrastrar */
.task.dragging{opacity:.35}
.drop-ph{height:48px;border:2px dashed var(--accent);border-radius:14px;opacity:.7;flex:none;background:var(--a-soft)}
/* semana */
.wnav{display:flex;align-items:center;gap:8px;margin:14px 2px 6px}
.wnav b{flex:1;text-align:center;font-size:16px;line-height:1.3}
.wnav .nb{width:38px;height:38px;border-radius:11px;background:var(--card);box-shadow:var(--shadow);font-size:19px;flex:none}
.wnav .nb:hover{color:var(--accent)}
.wday{margin-top:16px}
.wday-h{display:flex;align-items:center;gap:8px;margin:0 4px 8px}
.wday-h b{font-size:15.5px}
.wday-h .dt{color:var(--muted);font-size:14px}
.wday.is-today .wday-h b{color:var(--accent)}
.wday.past{opacity:.72}
.wadd{margin-left:auto;width:32px;height:32px;border-radius:9px;color:var(--muted);font-size:18px}
.wadd:hover{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.list.dz{min-height:46px;border-radius:14px}
.wfree{border:1.5px dashed var(--line);border-radius:14px;padding:11px 14px;color:var(--soft);font-size:14px}
/* buscar */
.sres{display:flex;flex-direction:column;gap:2px;margin-top:12px;max-height:55vh;overflow:auto}
.sr{display:flex;gap:10px;align-items:center;text-align:left;padding:9px 10px;border-radius:10px;width:100%}
.sr:hover{background:var(--card2)}
.sr .v{flex:1;min-width:0}
.sr b{display:block;font-weight:550}
.sr small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr.done b{text-decoration:line-through;color:var(--muted)}
mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
/* resumen semanal */
.statc{text-align:center;padding:6px 0 4px}
.bign{font-size:58px;font-weight:800;line-height:1;color:var(--accent);letter-spacing:-.03em}
.diff{font-size:13.5px;margin-top:6px;color:var(--muted)}
.diff.up{color:var(--ok);font-weight:600}
.bars{display:flex;gap:6px;align-items:flex-end;height:130px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar i{display:block;width:100%;max-width:40px;border-radius:8px 8px 3px 3px;background:var(--a-mid);min-height:4px}
.bar.best i{background:var(--accent)}
.bar small{font-size:11.5px;color:var(--muted);font-weight:600}
.bar span{font-size:12px;font-weight:700;min-height:16px}
.lbar{display:flex;align-items:center;gap:8px;font-size:14px;margin:7px 0}
.lbar .nm{width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbar .tr{flex:1;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.lbar .tr i{display:block;height:100%;border-radius:9px}

<script>

let KEY='kivo-v1',OLD='pendientes-v1';
const $=(s,r=document)=>r.querySelector(s);
function h(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
const uid=()=>{try{return crypto.randomUUID()}catch(e){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)})}};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const plus=(n,base)=>{const d=base?pd(base):new Date();d.setDate(d.getDate()+n);return iso(d)};
const cap=s=>String(s).replace(/^./,c=>c.toUpperCase());
function fmtDate(s){
  if(!s)return '';const t=today();
  if(s===t)return 'Hoy';if(s===plus(1))return 'Mañana';if(s===plus(-1))return 'Ayer';if(s===plus(2))return 'Pasado mañana';
  const d=pd(s),diff=Math.round((d-pd(t))/864e5);
  if(diff>2&&diff<7)return cap(d.toLocaleDateString('es',{weekday:'long'}));
  const o={weekday:'short',day:'numeric',month:'short'};if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';
  return cap(d.toLocaleDateString('es',o));
}
function fmtTime(t){if(!t)return '';const[a,b]=t.split(':').map(Number);const d=new Date();d.setHours(a,b,0,0);return d.toLocaleTimeString('es',{hour:'numeric',minute:'2-digit',hour12:true})}
function fmtStamp(ms){const d=new Date(ms);return fmtDate(iso(d)).toLowerCase()+' a las '+d.toLocaleTimeString('es',{hour:'numeric',minute:'2-digit',hour12:true})}

const DEFAULT_LISTS=[{id:'personal',name:'Personal',emoji:'🏠',color:'#16a34a'},{id:'arquizo',name:'Arquizo',emoji:'🏛️',color:'#2563eb'},{id:'zaitex',name:'Zaitex',emoji:'🎓',color:'#7c3aed'},{id:'tinta13',name:'Tinta13',emoji:'🎨',color:'#db2777'}];

/* ---------- datos ---------- */
function defaults(){return{v:2,name:'',accent:'#e8590c',theme:'auto',bg:'liso',sound:true,alerts:true,morning:'08:00',evening:'20:00',defRemind:'10',lists:[],tasks:[],filter:'all',view:'hoy',lastMorning:'',lastEvening:'',onboarded:false,bannerOff:false,showDone:false,contacts:[],lastWeekly:'',mine:false,teamAlerts:true,seeded:false,installOff:false}}

  try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
  S=Object.assign(defaults(),S||{});S.tasks=(S.tasks||[]).map(fixTask);S.lists=S.lists||[];
}
let HIST=[],REDO=[],lastJ=null,lastPush=0,restoring=false;
function snapJ(){return JSON.stringify({tasks:S.tasks,lists:S.lists},(k,v)=>(k==='alerted'||k==='snooze')?undefined:v)}
function save(){
  const j=snapJ();
  if(lastJ!==null&&j!==lastJ&&!restoring){const now=Date.now();if(now-lastPush>1200){HIST.push(lastJ);if(HIST.length>80)HIST.shift();REDO=[]}lastPush=now}
  lastJ=j;

  scheduleSync();
}
const listOf=id=>S.lists.find(l=>l.id===id);
const open=()=>S.tasks.filter(t=>t.status!=='done');
const byFilter=a=>{let r=S.filter==='all'?a:a.filter(t=>t.list===S.filter);if(S.mine)r=r.filter(mineOrFree);return r};

/* ---------- escritura inteligente ---------- */
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
const END='(?=[\\s.,;!?]|$)';
function parseSmart(raw){
  let s=' '+raw+' ';const out={date:null,time:null,star:false,list:null,contact:null,found:[]};
  const NUM={una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12};
  s=s.replace(/(a\s+las?\s+)(\d{1,2}|una|uno|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce)(\s+y\s+(media|cuarto))?(?=[\s.,;!?]|$)/gi,(m,a,n,_y,q)=>a+(NUM[norm(n)]||n)+(q?(norm(q)==='media'?':30':':15'):''));
  const take=(re,fn)=>{const m=s.match(re);if(!m)return false;if(fn(m)===false)return false;s=s.slice(0,m.index)+' '+s.slice(m.index+m[0].length);return true};
  const setT=(H,M,sx,defPm)=>{H=+H;M=+(M||0);if(H>23||M>59)return false;sx=norm(sx||'');
    if(/p|tarde|noche/.test(sx)&&H<12)H+=12;else if(/^a|manana/.test(sx)&&H===12)H=0;else if(!sx&&defPm&&H>=1&&H<=7)H+=12;
    out.time=pad(H)+':'+pad(M)};
  take(new RegExp('\\s(?:a\\s+las?|tipo|como\\s+a\\s+las?)\\s+(\\d{1,2})(?:[:.h](\\d{2}))?\\s*(am|pm|a\\.\\s?m\\.?|p\\.\\s?m\\.?|de\\s+la\\s+ma[ñn]ana|de\\s+la\\s+tarde|de\\s+la\\s+noche|del\\s+mediod[ií]a)?'+END,'i'),m=>setT(m[1],m[2],m[3],true))||
  take(new RegExp('\\s(\\d{1,2})(?::(\\d{2}))?\\s*(am|pm|a\\.\\s?m\\.?|p\\.\\s?m\\.?)'+END,'i'),m=>setT(m[1],m[2],m[3],false))||
  take(new RegExp('\\s(\\d{1,2}):(\\d{2})'+END),m=>setT(m[1],m[2],'',false));
  take(new RegExp('\\s(?:para\\s+)?pasado\\s+ma[ñn]ana'+END,'i'),()=>{out.date=plus(2)})||
  take(new RegExp('\\s(?:para\\s+)?(?<!la\\s)ma[ñn]ana'+END,'i'),()=>{out.date=plus(1)})||
  take(new RegExp('\\s(?:para\\s+)?hoy'+END,'i'),()=>{out.date=today()})||
  take(new RegExp('\\s(?:para\\s+)?(?:el\\s+|este\\s+|pr[oó]ximo\\s+)?(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)'+END,'i'),m=>{const i=DIAS.indexOf(norm(m[1]));let d=(i-new Date().getDay()+7)%7;if(d===0)d=7;out.date=plus(d)})||
  take(new RegExp('\\s(?:para\\s+)?(?:el\\s+)?(\\d{1,2})\\s+de\\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)'+END,'i'),m=>{let mi=MESES.indexOf(norm(m[2]));if(mi<0)mi=8;const n=+m[1];const d=new Date(new Date().getFullYear(),mi,n);if(d.getDate()!==n)return false;if(iso(d)<today())d.setFullYear(d.getFullYear()+1);out.date=iso(d)})||
  take(new RegExp('\\s(\\d{1,2})/(\\d{1,2})(?:/(\\d{2,4}))?'+END),m=>{const n=+m[1],mo=+m[2]-1;let y=m[3]?(+m[3]<100?2000+(+m[3]):+m[3]):new Date().getFullYear();const d=new Date(y,mo,n);if(d.getMonth()!==mo||d.getDate()!==n)return false;if(!m[3]&&iso(d)<today())d.setFullYear(y+1);out.date=iso(d)});
  take(/\s#([^\s#]+)/,m=>{const q=norm(m[1]);const l=S.lists.find(l=>norm(l.name).replace(/\s+/g,'').startsWith(q));if(!l)return false;out.list=l.id});
  take(/\s!{1,3}(?=\s|$)/,()=>{out.star=true});
  let phone=null;take(/\s(?:\+?51[\s-]?)?(9\d{2}[\s-]?\d{3}[\s-]?\d{3})(?=[\s.,;!?]|$)/,m=>{phone=m[1].replace(/\D/g,'')});
  {const ns=norm(s);const c=(S.contacts||[]).filter(c=>c.name&&c.name.length>=3).sort((a,b)=>b.name.length-a.name.length).find(c=>new RegExp('(^|\\s)'+norm(c.name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=[\\s.,;!?]|$)').test(ns));if(c)out.contact={name:c.name,phone:c.phone||''}}
  if(phone){const k=(S.contacts||[]).find(c=>c.phone===phone);out.contact={name:(k&&k.name)||(out.contact&&out.contact.name)||'',phone}}
  if(out.date)out.found.push('📅 '+fmtDate(out.date));
  if(out.time)out.found.push('⏰ '+fmtTime(out.time));
  if(out.list){const l=listOf(out.list);out.found.push(l.emoji+' '+l.name)}
  if(out.star)out.found.push('⭐ Importante');
  if(out.contact)out.found.push('👤 '+(out.contact.name||out.contact.phone));
  out.text=s.replace(/\s+/g,' ').trim().replace(/\s+(para el|para|el|a|en|de|este)$/i,'').trim();
  return out;
}

/* ---------- agregar ---------- */
let D;
function resetDraft(){D={date:today(),time:'',remind:S.defRemind,repeat:'',star:false,list:'',emoji:'',assignee:''}}

  return{p,text:p.text,date:p.date!==null?p.date:D.date,time:p.time||D.time,star:D.star||p.star,list:p.list||D.list||(S.filter!=='all'?S.filter:''),emoji:D.emoji,remind:D.remind,repeat:D.repeat,contact:p.contact,assignee:D.assignee||null};
}
function renderAdd(){
  const e=eff();const c=$('#chips');c.innerHTML='';
  const chip=(label,on,fn,title)=>{const b=h('button','chip'+(on?' on':''),label);if(title)b.title=title;b.onclick=()=>{fn();renderAdd();$('#txt').focus()};c.append(b);return b};

  chip('☀️ Hoy',e.date===t,()=>{D.date=t});

  chip('📅 '+(custom?esc(fmtDate(e.date)):e.date?'Otro día':'Sin fecha'),custom||!e.date,()=>openWhen(e,v=>{Object.assign(D,v);renderAdd()}),'Elegir fecha, hora y aviso');
  chip('⏰ '+(e.time?esc(fmtTime(e.time)):'Hora'),!!e.time,()=>openWhen(e,v=>{Object.assign(D,v);renderAdd()},true),'Elegir hora y aviso');
  if(e.repeat)chip('🔁 '+REPEATS[e.repeat],true,()=>openWhen(e,v=>{Object.assign(D,v);renderAdd()}));
  const l=listOf(e.list);
  chip(l?esc(l.emoji+' '+l.name):'📁 Lista',!!l,()=>pickList(D.list,id=>{D.list=id;renderAdd()}));
  if(l&&isShared(l.id)){const m=MEMBERS[e.assignee];chip(m?avatarHTML(m)+' '+esc(e.assignee===ME?'Yo':firstName(m.name)):'👤 Responsable',!!m,()=>pickAssignee(l.id,D.assignee,id=>{D.assignee=id;renderAdd()}),'¿Quién se encarga?')}

function addTask(){
  const e=eff();if(!e.text){$('#txt').focus();if($('#txt').value.trim())toast('Escribe qué tienes que hacer 🙂');return}
  let date=e.date;if(e.time&&!date)date=today();
  const t=fixTask({text:e.text,emoji:e.emoji,list:e.list,date,time:e.time,remind:e.remind,repeat:e.repeat,star:e.star,contact:e.contact,assignee:(e.assignee&&isShared(e.list))?e.assignee:null,owner:ME});
  S.tasks.push(t);if(e.contact&&e.contact.name)rememberContact(e.contact);save();$('#txt').value='';const keepList=D.list;resetDraft();D.list=keepList;
  if(S.view==='hoy'&&date>today())toast('Agregada para '+fmtDate(date).toLowerCase()+(e.time?' a las '+fmtTime(e.time):'')+' 👍');
  else if(S.view==='prox'&&(!date||date<=today()))toast('Agregada ✓ La verás en «Hoy»');
  else if(S.view==='hechas')toast('Agregada ✓ La verás en «Hoy»');
  if(e.time&&notifState()==='default')S.bannerOff=false;
  renderAdd();renderList();$('#txt').focus();
}

const MODALS=[];
function openModal(node,opt){
  opt=opt||{};const ov=h('div','ov'+(opt.side?' side':''));const m=h('div','modal '+(opt.cls||''));m.append(node);ov.append(m);
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal()});document.body.append(ov);MODALS.push({ov,onClose:opt.onClose});return m;
}
function closeModal(){const m=MODALS.pop();if(!m)return;m.ov.remove();if(m.onClose)m.onClose()}

/* ---------- elegir fecha y hora ---------- */
function openWhen(cur,cb,focusTime){
  const st={date:cur.date||'',time:cur.time||'',remind:cur.remind||S.defRemind,repeat:cur.repeat||''};
  let vm=st.date?pd(st.date):new Date();vm=new Date(vm.getFullYear(),vm.getMonth(),1);
  const box=h('div','mpad');
  const draw=()=>{
    box.innerHTML='';mhead('¿Cuándo?',box);
    const q=h('div','quick');
    const qb=(label,d)=>{const b=h('button','chip'+(st.date===d?' on':''),label);b.onclick=()=>{st.date=d;if(d){const x=pd(d);vm=new Date(x.getFullYear(),x.getMonth(),1)}draw()};q.append(b)};
    const dow=new Date().getDay();
    qb('☀️ Hoy',today());qb('🌅 Mañana',plus(1));qb('🏖️ Sábado',plus(((6-dow+7)%7)||7));qb('📆 Próx. lunes',plus(((1-dow+7)%7)||7));qb('🚫 Sin fecha','');
    box.append(q);
    const ch=h('div','calh');const pv=h('button','','‹');pv.title='Mes anterior';pv.onclick=()=>{vm.setMonth(vm.getMonth()-1);draw()};
    const nx=h('button','','›');nx.title='Mes siguiente';nx.onclick=()=>{vm.setMonth(vm.getMonth()+1);draw()};
    ch.append(h('b','',esc(cap(vm.toLocaleDateString('es',{month:'long',year:'numeric'})))),pv,nx);box.append(ch);
    const g=h('div','cgrid');['lu','ma','mi','ju','vi','sá','do'].forEach(d=>g.append(h('div','dw',d)));
    const off=(vm.getDay()+6)%7;const start=new Date(vm.getFullYear(),vm.getMonth(),1-off);const t=today();
    const busy=new Set(open().map(x=>x.date));
    for(let i=0;i<42;i++){
      const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i);const s=iso(d);
      if(i>=35&&d.getMonth()!==vm.getMonth())break;
      const b=h('button',[d.getMonth()!==vm.getMonth()?'out':'',s<t?'past':'',s===t?'tod':'',s===st.date?'sel':'',busy.has(s)?'dot':''].join(' '),String(d.getDate()));
      b.title=cap(d.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'}))+(busy.has(s)?' · tienes pendientes':'');
      b.onclick=()=>{st.date=s;draw()};g.append(b);
    }
    box.append(g);
    box.append(h('div','lbl','Hora'));
    const tr=h('div','trow');const ti=h('input','field');ti.type='time';ti.value=st.time;ti.oninput=()=>{st.time=ti.value;sync()};
    tr.append(ti);[['09:00','9 am'],['12:00','12 pm'],['15:00','3 pm'],['18:00','6 pm'],['20:00','8 pm']].forEach(([v,l])=>{const b=h('button','chip'+(st.time===v?' on':''),l);b.onclick=()=>{st.time=v;draw()};tr.append(b)});
    if(st.time){const n=h('button','chip','Sin hora');n.onclick=()=>{st.time='';draw()};tr.append(n)}
    box.append(tr);
    const two=h('div','two');
    const c1=h('div');c1.append(h('div','lbl','🔔 Avisarme'));const rs=h('select','field');Object.entries(REMINDS).forEach(([k,v])=>{const o=h('option','',v);o.value=k;if(k===st.remind)o.selected=true;rs.append(o)});rs.onchange=()=>{st.remind=rs.value};c1.append(rs);
    const c2=h('div');c2.append(h('div','lbl','🔁 Repetir'));const rp=h('select','field');Object.entries(REPEATS).forEach(([k,v])=>{const o=h('option','',v);o.value=k;if(k===st.repeat)o.selected=true;rp.append(o)});rp.onchange=()=>{st.repeat=rp.value};c2.append(rp);
    two.append(c1,c2);box.append(two);
    const note=h('div','small-note');box.append(note);
    const sync=()=>{rs.disabled=!st.time;note.textContent=st.time?'':'Sin hora: te la recuerdo en el resumen de la mañana de ese día.'};sync();
    const f=h('div','foot');f.append(h('div','grow'));
    const cn=h('button','btn ghost','Cancelar');cn.onclick=closeModal;
    const ok=h('button','btn primary','Listo');ok.onclick=()=>{if(st.time&&!st.date)st.date=today();closeModal();cb({...st})};
    f.append(cn,ok);box.append(f);
    if(focusTime)setTimeout(()=>{ti.focus();try{ti.showPicker()}catch(e){}},50),focusTime=false;
  };
  draw();openModal(box,{cls:'small'});
}

const cmp=(a,b)=>a<b?-1:a>b?1:0;
function sortT(a,b){
  return (b.star-a.star)||cmp(a.date||'9999',b.date||'9999')||((a.ord==null)-(b.ord==null))||cmp(a.ord||0,b.ord||0)||cmp(a.time||'99',b.time||'99')||a.at-b.at;
}
function renderList(){

  const todayL=fo.filter(x=>x.date&&x.date<=t),prox=fo.filter(x=>x.date&&x.date>t);
  const doneAll=byFilter(S.tasks.filter(x=>x.status==='done'));

  document.querySelectorAll('.tab').forEach(b=>{b.classList.toggle('on',b.dataset.v===S.view);b.querySelector('.n').textContent=counts[b.dataset.v]||''});
  // filtros
  const fl=$('#filters');fl.innerHTML='';

  fchip('Todo','all',null,op.length);

  S.lists.forEach(l=>{const b=fchip(esc(l.emoji+' '+l.name)+(isShared(l.id)?' <span title="Compartida con tu equipo">👥</span>':''),l.id,l.color,op.filter(x=>x.list===l.id).length);b.title='Doble clic o clic derecho para editar';b.ondblclick=()=>openListEditor(l);b.oncontextmenu=e=>{e.preventDefault();openListEditor(l)}});
  const cur=listOf(S.filter);if(cur){const ed=h('button','fchip edit','✎');ed.title='Editar «'+cur.name+'»';ed.onclick=()=>openListEditor(cur);fl.append(ed)}
  const nb=h('button','fchip add','＋ Lista');nb.title='Crear una lista nueva (un negocio, proyecto…)';nb.onclick=()=>openListEditor();fl.append(nb);
  // anillo, racha, subtítulo
  const allToday=op.filter(x=>x.date&&x.date<=t).length,doneToday=S.tasks.filter(x=>x.status==='done'&&x.doneOn===t).length,tot=allToday+doneToday;
  $('#ringTxt').textContent=doneToday+'/'+tot;$('#ringFg').style.strokeDashoffset=150.8*(1-(tot?doneToday/tot:0));
  const sk=streak();$('#streak').textContent=sk>=2?'🔥 '+sk+' días':'';

  $('#sub').textContent=cap(new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'}))+' · '+(allToday?(allToday===1?'1 pendiente hoy':allToday+' pendientes hoy'):'nada pendiente hoy ✨')+(late?' ('+late+' atrasada'+(late>1?'s':'')+')':'');
  renderBanner();
  const out=$('#out');out.innerHTML='';
  const section=(title,list,cls,dropDate)=>{if(!list.length)return;out.append(h('div','sec '+(cls||''),esc(title)+' · '+list.length));const l=h('div','list');setupDrop(l,dropDate);list.sort(sortT).forEach(x=>l.append(row(x)));out.append(l)};
  const empty=(ic,msg)=>out.append(h('div','empty',`<div class="big">${ic}</div>${msg}`));
  if(S.view==='hoy'){
    section('Atrasadas',todayL.filter(x=>x.date<t),'late');section('Para hoy',todayL.filter(x=>x.date===t),'',t);

      if(S.showDone){const l=h('div','list');dt.sort((a,b)=>b.doneAt-a.doneAt).forEach(x=>l.append(row(x)));out.append(l)}}

function row(x){

  if(x.repeat)meta.append(h('span','','🔁 '+REPEATS[x.repeat]));

  if(!done&&x.date&&x.date<=t){const q=h('button','qb','→ Mañana');q.title='Pasarla a mañana';q.onclick=e=>{e.stopPropagation();x.date=plus(1);save();renderList();toast('Movida a mañana 👌')};meta.append(q)}
  if(meta.children.length)body.append(meta);
  if(done&&x.doneNote)body.append(h('div','note-prev','“'+esc(x.doneNote.length>110?x.doneNote.slice(0,110)+'…':x.doneNote)+'”'));
  r.append(body);
  if(!done){const st=h('button','star'+(x.star?' on':''),x.star?'★':'☆');st.title=x.star?'Quitar importante':'Marcar como importante';st.onclick=e=>{e.stopPropagation();x.star=!x.star;save();renderList()};r.append(st)}
  r.onclick=()=>openDetail(x);
  return r;
}

/* ---------- hecho / repetir ---------- */
function nextDate(d,rep){
  const x=pd(d||today());
  if(rep==='day')x.setDate(x.getDate()+1);
  else if(rep==='week5'){do{x.setDate(x.getDate()+1)}while(x.getDay()===0||x.getDay()===6)}
  else if(rep==='week')x.setDate(x.getDate()+7);
  else if(rep==='month'){const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+1);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}
  let s=iso(x);if(s<today()&&rep)return nextDate(s,rep);return s;
}
function setDone(x,done){
  if(done){
    x.status='done';x.doneAt=Date.now();x.doneOn=today();x.snooze=null;x.doneBy=ME;x.progress=100;
    if(x.repeat&&!x.spawned){x.spawned=true;const n=fixTask(JSON.parse(JSON.stringify(x)));Object.assign(n,{id:uid(),owner:ME,progress:0,doneBy:null,status:'todo',doneAt:null,doneOn:null,doneNote:'',mood:'',alerted:'',spawned:false,date:nextDate(x.date,x.repeat),at:Date.now()});n.subtasks.forEach(s=>{s.done=false;s.id=uid()});S.tasks.push(n)}
  }else{x.status='todo';x.doneAt=null;x.doneOn=null;x.doneBy=null;if(x.progress===100)x.progress=0}
  save();
}
function toggleDone(x,el,rowEl){
  if(x.status==='done'){setDone(x,false);renderList();return}
  setDone(x,true);sfx('done');
  if(el){const r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,28,7)}
  if(rowEl){rowEl.classList.add('done');setTimeout(()=>{rowEl.classList.add('leaving');setTimeout(renderList,330)},280)}else renderList();
  const left=open().filter(y=>y.date&&y.date<=today()).length;
  if(left===0&&x.date&&x.date<=today()){setTimeout(()=>{bigParty();toast('🎉 ¡Terminaste todo lo de hoy!','¿Cómo te fue?',()=>openDetail(x,true))},350)}
  else toast(x.repeat?'¡Hecha! ✅ La siguiente queda para '+fmtDate(nextDate(x.date,x.repeat)).toLowerCase():'¡Hecha! ✅','¿Cómo te fue?',()=>openDetail(x,true));
}
function streak(){const set=new Set(S.tasks.filter(t=>t.doneOn).map(t=>t.doneOn));let n=0,d=set.has(today())?0:1;while(set.has(plus(-d))){n++;d++}return n}
function clearDone(){const n=S.tasks.filter(x=>x.status==='done').length;if(!n){toast('No hay tareas hechas');return}const old=S.tasks.slice();S.tasks=S.tasks.filter(x=>x.status!=='done');save();renderList();toast(n+' tareas hechas borradas','Deshacer',()=>{S.tasks=old;save();renderList()})}

function dueMs(x){const d=pd(x.date);const[a,b]=x.time.split(':').map(Number);d.setHours(a,b,0,0);return d.getTime()}
function fireTask(x){
  const mins=Math.round((dueMs(x)-Date.now())/6e4);
  const when=mins<=0?'Es ahora'+(mins<-1?' (era a las '+fmtTime(x.time)+')':''):mins<60?'En '+mins+' min, a las '+fmtTime(x.time):mins<1440?'Hoy a las '+fmtTime(x.time):fmtDate(x.date)+' a las '+fmtTime(x.time);
  const l=listOf(x.list);const title='⏰ '+(x.emoji?x.emoji+' ':'')+x.text;const body=when+(l?' · '+l.emoji+' '+l.name:'');
  sfx('alert');sysNotify(title,body,()=>openDetail(x),x.id);
  inAppAlert(title,body,[['✓ Hecha',()=>{setDone(x,true);sfx('done');burst(200,90,30,7);renderList();toast('¡Hecha! ✅','¿Cómo te fue?',()=>openDetail(x,true))},true],['Posponer 10 min',()=>{x.snooze=Date.now()+6e5;save();toast('Te aviso en 10 minutos ⏳')}],['Ver',()=>openDetail(x)]]);

  inAppAlert(title,body,[['Ver',()=>{S.view=goView;save();renderList();scrollTo({top:0,behavior:'smooth'})},true]],25000);

const listTxt=a=>a.sort(sortT).slice(0,4).map(x=>'• '+(x.emoji?x.emoji+' ':'')+x.text+(x.time?' ('+fmtTime(x.time)+')':'')).join('\n')+(a.length>4?'\n…y '+(a.length-4)+' más':'');
function tick(){
  if(!S.alerts||!S.onboarded)return;
  const now=Date.now(),t=today(),d=new Date(),hm=pad(d.getHours())+':'+pad(d.getMinutes());
  open().filter(mineOrFree).forEach(x=>{
    if(x.snooze&&now>=x.snooze){x.snooze=null;save();fireTask(x);return}
    if(!x.date||!x.time||x.remind==='none'||x.snooze)return;
    const at=dueMs(x)-Number(x.remind||0)*6e4,key=x.date+'|'+x.time+'|'+x.remind;
    if(x.alerted!==key&&now>=at&&now-at<6*36e5){x.alerted=key;save();fireTask(x)}
  });
  if(S.lastMorning!==t&&hm>=S.morning){
    S.lastMorning=t;save();const op=open().filter(mineOrFree),td=op.filter(x=>x.date===t),late=op.filter(x=>x.date&&x.date<t);
    if(td.length+late.length)fireSummary(greet()+(S.name?', '+S.name:'')+' ☀️ Hoy tienes '+(td.length+late.length)+' pendiente'+(td.length+late.length>1?'s':''),listTxt(late.concat(td))+(late.length?'\n⚠️ '+late.length+' atrasada'+(late.length>1?'s':''):''),'hoy');
  }
  if(S.lastEvening!==t&&hm>=S.evening){
    S.lastEvening=t;save();const tm=open().filter(mineOrFree).filter(x=>x.date===plus(1));
    if(tm.length)fireSummary('🌙 Para mañana tienes '+tm.length+' pendiente'+(tm.length>1?'s':''),listTxt(tm),'prox');
  }
  const dow=d.getDay();let wk=null,off=0;
  if(dow===0&&hm>=S.evening){wk=weekStart(0);off=0}else if(dow===1){wk=weekStart(-1);off=-1}
  if(wk&&S.lastWeekly!==wk){
    S.lastWeekly=wk;save();const n=S.tasks.filter(x=>x.status==='done'&&x.doneOn>=wk&&x.doneOn<=plus(6,wk)).length;
    const title='📊 Tu resumen de la semana',body=n?'Completaste '+n+' tarea'+(n>1?'s':'')+'. ¡Mira cómo te fue!':'Mira cómo te fue esta semana.';
    sfx('alert');sysNotify(title,body,()=>{statsOff=off;openStats()},'semana');
    inAppAlert(title,body,[['Ver resumen',()=>{statsOff=off;openStats()},true]],60000);
  }
}

let AC=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}catch(e){return null}}
document.addEventListener('pointerdown',()=>ac(),{once:true});
function sfx(kind){
  if(!S.sound)return;const c=ac();if(!c)return;const t=c.currentTime;
  const notes=kind==='alert'?[[784,0],[1047,.16],[1319,.32]]:[[660,0],[990,.09]];
  notes.forEach(([f,dl])=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+dl);g.gain.linearRampToValueAtTime(kind==='alert'?.2:.12,t+dl+.02);g.gain.exponentialRampToValueAtTime(.001,t+dl+(kind==='alert'?.6:.3));o.connect(g);g.connect(c.destination);o.start(t+dl);o.stop(t+dl+.65)});
}

const FX=$('#fx'),G=FX.getContext('2d');let parts=[],raf=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(x,y,n,sp){
  if(reduce)return;const cols=[S.accent,'#ffd43b','#51cf66','#4dabf7','#f783ac','#ff922b'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=Math.random()*sp+2;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.6,s:4+Math.random()*5,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:70+Math.random()*40})}
  if(!raf)loop();
}
function bigParty(){burst(innerWidth*.2,innerHeight*.8,70,13);burst(innerWidth*.8,innerHeight*.8,70,13);setTimeout(()=>burst(innerWidth/2,innerHeight*.4,60,10),250);sfx('alert')}
function loop(){
  const dpr=devicePixelRatio||1;if(FX.width!==innerWidth*dpr){FX.width=innerWidth*dpr;FX.height=innerHeight*dpr}
  G.setTransform(dpr,0,0,dpr,0,0);G.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;G.save();G.globalAlpha=Math.min(1,p.life/25);G.translate(p.x,p.y);G.rotate(p.r);G.fillStyle=p.c;G.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);G.restore()});
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+30);raf=parts.length?requestAnimationFrame(loop):(G.clearRect(0,0,innerWidth,innerHeight),null);
}

function isDark(){return S.theme==='dark'||(S.theme==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches)}
function bgCss(key,dark){

  if(key==='mio')return dark?`linear-gradient(165deg,color-mix(in srgb,${S.accent} 28%,#171615) 0%,#171615 65%)`:`linear-gradient(165deg,color-mix(in srgb,${S.accent} 22%,#fff) 0%,#f6f5f2 70%)`;
  const c=dark?b.d:b.l;return `linear-gradient(165deg,${c[0]} 0%,${c[1]} 45%,${dark?'#171615':'#f6f5f2'} 100%)`;
}

/* ---------- arrastrar para ordenar o cambiar de día ---------- */
let DRAG=null,CURDETAIL=null;
function whenTxt(d){return !d?'sin fecha':d===today()?'hoy':d===plus(1)?'mañana':'el '+fmtDate(d).toLowerCase()}
function setupDrop(l,dropDate){
  l.addEventListener('dragover',e=>{
    if(!DRAG)return;const inside=[...l.children].some(r=>r.dataset&&r.dataset.id===DRAG);
    if(!inside&&dropDate===undefined)return;
    e.preventDefault();e.dataTransfer.dropEffect='move';
    const rows=[...l.querySelectorAll('.task:not(.dragging)')];
    const after=rows.find(r=>{const b=r.getBoundingClientRect();return e.clientY<b.top+b.height/2});
    let ph=document.querySelector('.drop-ph');if(!ph)ph=h('div','drop-ph');
    if(after){if(ph.nextSibling!==after||ph.parentNode!==l)l.insertBefore(ph,after)}else if(ph.parentNode!==l||ph.nextSibling)l.append(ph);
  });
  l.addEventListener('drop',e=>{
    if(!DRAG)return;e.preventDefault();const id=DRAG;DRAG=null;
    const x=S.tasks.find(t=>t.id===id);if(!x)return;
    const ids=[];[...l.children].forEach(c=>{if(c.classList.contains('drop-ph'))ids.push(id);else if(c.dataset&&c.dataset.id&&c.dataset.id!==id)ids.push(c.dataset.id)});
    if(!ids.includes(id))ids.push(id);
    document.querySelectorAll('.drop-ph').forEach(p=>p.remove());
    if(dropDate!==undefined&&x.date!==dropDate){x.date=dropDate;x.alerted='';x.snooze=null;toast('Movida para '+whenTxt(dropDate)+' 👌')}
    ids.forEach((k,i)=>{const t=S.tasks.find(y=>y.id===k);if(t)t.ord=i});
    save();renderList();
  });
}
window.addEventListener('dragover',e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files'))e.preventDefault()});
window.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files.length)e.preventDefault()});

let weekOff=0;
function weekStart(off){const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+off*7);return iso(d)}
function renderWeek(out,fo,t){
  const ws=weekStart(weekOff),we=plus(6,ws);
  const nav=h('div','wnav');
  const pv=h('button','nb','‹');pv.title='Semana anterior';pv.onclick=()=>{weekOff--;renderList()};
  const nx=h('button','nb','›');nx.title='Semana siguiente';nx.onclick=()=>{weekOff++;renderList()};
  const a=pd(ws),b=pd(we);
  const lbl=a.getMonth()===b.getMonth()?a.getDate()+' al '+b.getDate()+' de '+b.toLocaleDateString('es',{month:'long'}):a.toLocaleDateString('es',{day:'numeric',month:'short'})+' al '+b.toLocaleDateString('es',{day:'numeric',month:'short'});
  const name=weekOff===0?'Esta semana':weekOff===1?'Próxima semana':weekOff===-1?'Semana pasada':'';
  nav.append(pv,h('b','',(name?name+'<br>':'')+'<small style="font-weight:500;color:var(--muted)">'+esc(lbl)+'</small>'),nx);out.append(nav);
  if(weekOff!==0){const bk=h('div');bk.style.textAlign='center';const b2=h('button','btn ghost','↩ Volver a esta semana');b2.onclick=()=>{weekOff=0;renderList()};bk.append(b2);out.append(bk)}
  const late=fo.filter(x=>x.date&&x.date<t);
  if(weekOff===0&&late.length){out.append(h('div','sec late','Atrasadas · '+late.length+' · arrástralas a un día'));const l=h('div','list');setupDrop(l);late.sort(sortT).forEach(x=>l.append(row(x)));out.append(l)}
  for(let i=0;i<7;i++){
    const d=plus(i,ws),dd=pd(d);
    const items=fo.filter(x=>x.date===d);const dn=byFilter(S.tasks.filter(x=>x.status==='done'&&x.date===d));
    const wd=h('div','wday'+(d===t?' is-today':'')+(d<t?' past':''));
    const hd=h('div','wday-h',`<b>${esc(cap(dd.toLocaleDateString('es',{weekday:'long'})))}</b><span class="dt">${dd.getDate()} ${esc(dd.toLocaleDateString('es',{month:'short'}))}</span>${d===t?'<span class="badge">Hoy</span>':''}${items.length?'<span class="dt">· '+items.length+'</span>':''}`);
    const ad=h('button','wadd','＋');ad.title='Agregar una tarea para este día';
    ad.onclick=()=>{D.date=d;renderAdd();scrollTo({top:0,behavior:'smooth'});$('#txt').focus();toast('Escribe la tarea para '+whenTxt(d)+' ✍️')};
    hd.append(ad);wd.append(hd);
    const l=h('div','list dz');setupDrop(l,d);
    items.sort(sortT).forEach(x=>l.append(row(x)));dn.forEach(x=>l.append(row(x)));
    if(!items.length&&!dn.length)l.append(h('div','wfree',d<t?'—':'Libre ✨'));
    wd.append(l);out.append(wd);
  }
}

/* ---------- buscar ---------- */
function hl(text,q){
  const map=[];let ns='';
  for(let i=0;i<text.length;i++){const c=norm(text[i]);for(let k=0;k<c.length;k++)map.push(i);ns+=c}
  const k=ns.indexOf(q);if(k<0||!q)return esc(text);
  const a=map[k],b=map[k+q.length-1]+1;return esc(text.slice(0,a))+'<mark>'+esc(text.slice(a,b))+'</mark>'+esc(text.slice(b));
}
function openSearch(){
  const box=h('div','mpad');mhead('🔍 Buscar',box);
  const inp=h('input','field');inp.placeholder='Busca una tarea, nota, paso o contacto…';inp.style.fontSize='17px';box.append(inp);
  const res=h('div','sres');box.append(res);let first=null;
  const draw=()=>{
    res.innerHTML='';first=null;const raw=inp.value.trim(),q=norm(raw);
    if(!q){res.append(h('div','small-note','Busca en todas tus tareas: pendientes y hechas, con sus notas, pasos, contactos y archivos.'));return}
    const hits=S.tasks.map(t=>{
      const l=listOf(t.list);
      const hay=[t.text,t.notes,t.doneNote,t.subtasks.map(s=>s.text).join(' · '),t.contact?(t.contact.name+' '+t.contact.phone):'',l?l.name:'',(t.attach||[]).map(a=>a.name).join(' ')].filter(Boolean).join(' · ');
      const i=norm(hay).indexOf(q);if(i<0)return null;
      let snip='';if(!norm(t.text).includes(q)){const st=Math.max(0,i-30);snip=(st?'…':'')+hay.slice(st,i+70).replace(/\n/g,' ')}
      return{t,snip}}).filter(Boolean);
    hits.sort((a,b)=>((a.t.status==='done')-(b.t.status==='done'))||(b.t.at-a.t.at));
    if(!hits.length){res.append(h('div','small-note','No encontré nada con «'+esc(raw)+'».'));return}
    hits.slice(0,60).forEach(({t,snip})=>{
      const dn=t.status==='done';
      const r=h('button','sr'+(dn?' done':''),`<span class="temoji">${esc(t.emoji||(dn?'✅':'⭕'))}</span><span class="v"><b>${hl(t.text,q)}</b><small>${dn?'Hecha '+esc(fmtStamp(t.doneAt||t.at)):(t.date?'📅 '+esc(fmtDate(t.date))+(t.time?' · '+esc(fmtTime(t.time)):''):'Sin fecha')}${snip?' · '+hl(snip,q):''}</small></span>`);
      r.onclick=()=>{closeModal();openDetail(t)};if(!first)first=r;res.append(r)});
  };
  inp.oninput=draw;inp.onkeydown=e=>{if(e.key==='Enter'&&first){e.preventDefault();first.click()}};
  draw();openModal(box);setTimeout(()=>inp.focus(),30);
}

let syncT=null,flushP=null,again=false,retryT=null;
function scheduleSync(){if(!ME||!READY)return;setSync('busy');clearTimeout(syncT);syncT=setTimeout(flush,450)}
function flush(){
  if(!ME||!READY||!sb)return Promise.resolve();
  if(flushP){again=true;return flushP}
  flushP=doFlush().catch(e=>{console.warn('sync',e);setSync('err');clearTimeout(retryT);retryT=setTimeout(flush,12000)}).finally(()=>{flushP=null;if(again){again=false;flush()}});
  return flushP;

const actRow=(t,kind,body)=>({id:uid(),task_id:t.id,user_id:ME,kind,body:body||'',task_text:t.text||'',dev:DEV});
async function doFlush(){
  const curL=new Set(S.lists.map(l=>l.id));
  for(const l of S.lists){
    const r=listRow(l),j=JSON.stringify(r);
    if(!(l.id in SYNC.lists)){l.owner=l.owner||ME;const {error}=await sb.from('lists').insert({...r,owner:l.owner});if(error)throw error;if(!LMEM[l.id])LMEM[l.id]=[ME];SYNC.lists[l.id]=j}
    else if(SYNC.lists[l.id]!==j){const {error}=await sb.from('lists').update(r).eq('id',l.id);if(error){if(isNet(error))throw error;console.warn(error)}SYNC.lists[l.id]=j}
  }
  for(const id of Object.keys(SYNC.lists)){
    if(curL.has(id))continue;
    const a=await sb.from('lists').delete().eq('id',id);if(a.error&&isNet(a.error))throw a.error;
    const b=await sb.from('list_members').delete().eq('list_id',id).eq('user_id',ME);if(b.error&&isNet(b.error))throw b.error;
    delete SYNC.lists[id];delete LMEM[id];
  }
  const ins=[],upd=[],acts=[],ids=new Set();
  for(const t of S.tasks){
    ids.add(t.id);if(t.list&&!curL.has(t.list))t.list='';
    const r=taskRow(t),j=JSON.stringify(r);
    if(!(t.id in SYNC.tasks)){ins.push({t,r,j});if(isShared(t.list))acts.push(actRow(t,'create'))}
    else if(SYNC.tasks[t.id]!==j){
      upd.push({t,r,j});let o={};try{o=JSON.parse(SYNC.tasks[t.id])}catch(e){}
      const progCh=o.progress!==r.progress&&r.status!=='done'&&r.progress>0;
      if(o.status!==r.status&&!(r.status==='doing'&&progCh))acts.push(actRow(t,'status',r.status));
      else if(progCh)acts.push(actRow(t,'progress',String(r.progress)));
      if((o.assignee||null)!==(r.assignee||null))acts.push(actRow(t,'assign',r.assignee||''));
      if((o.date||null)!==(r.date||null)&&r.status!=='done')acts.push(actRow(t,'date',r.date||''));
    }
  }
  const del=Object.keys(SYNC.tasks).filter(id=>!ids.has(id));
  if(ins.length){
    const rows=ins.map(({t,r})=>({...r,owner:t.owner||ME,updated_by:ME,updated_dev:DEV}));
    const {error}=await sb.from('tasks').insert(rows);
    if(!error)ins.forEach(x=>{x.t.owner=x.t.owner||ME;SYNC.tasks[x.t.id]=x.j});
    else{if(isNet(error))throw error;
      for(const x of ins){const e2=(await sb.from('tasks').insert({...x.r,owner:x.t.owner||ME,updated_by:ME,updated_dev:DEV})).error;if(e2&&isNet(e2))throw e2;if(!e2){x.t.owner=x.t.owner||ME;SYNC.tasks[x.t.id]=x.j}else console.warn('insert',e2)}}
  }
  for(const x of upd){const {error}=await sb.from('tasks').update({...x.r,updated_by:ME,updated_dev:DEV}).eq('id',x.t.id);if(error){if(isNet(error))throw error;console.warn('update',error)}SYNC.tasks[x.t.id]=x.j}
  if(del.length){const {error}=await sb.from('tasks').delete().in('id',del);if(error&&isNet(error))throw error;del.forEach(id=>delete SYNC.tasks[id])}
  const okActs=acts.filter(a=>a.task_id in SYNC.tasks);
  if(okActs.length){sb.from('activity').insert(okActs).then(()=>{},()=>{});okActs.forEach(a=>{if(ACT[a.task_id])ACT[a.task_id].items.unshift({...a,created_at:new Date().toISOString()})})}
  cacheLocal();setSync('ok');
}

let fetchP=null;
function fetchAll(){if(fetchP)return fetchP;fetchP=doFetch().finally(()=>{fetchP=null});return fetchP}
async function doFetch(){
  const [L,M,P,T]=await Promise.all([sb.from('lists').select('*'),sb.from('list_members').select('*'),sb.from('profiles').select('*'),sb.from('tasks').select('*')]);
  const err=L.error||M.error||P.error||T.error;if(err)throw err;
  MEMBERS={};(P.data||[]).forEach(p=>MEMBERS[p.id]=p);
  if(!MEMBERS[ME])MEMBERS[ME]={id:ME,name:S.name,email:MYEMAIL,color:S.accent};
  LMEM={};(M.data||[]).forEach(m=>(LMEM[m.list_id]=LMEM[m.list_id]||[]).push(m.user_id));
  const prev={};S.tasks.forEach(t=>prev[t.id]=t);
  const serverIds=new Set((T.data||[]).map(r=>r.id));
  const next=[];
  (T.data||[]).forEach(r=>{
    const inc=fromTaskRow(r),loc=prev[inc.id];
    if(loc&&(inc.id in SYNC.tasks)&&JSON.stringify(taskRow(loc))!==SYNC.tasks[inc.id]){next.push(loc);return}
    if(loc){inc.alerted=loc.alerted;inc.snooze=loc.snooze}
    next.push(inc);SYNC.tasks[inc.id]=JSON.stringify(taskRow(inc));
  });
  S.tasks.forEach(t=>{if(!serverIds.has(t.id)&&!(t.id in SYNC.tasks))next.push(t)});
  Object.keys(SYNC.tasks).forEach(id=>{if(!serverIds.has(id))delete SYNC.tasks[id]});
  S.tasks=next;
  const sL=new Set((L.data||[]).map(l=>l.id));
  const localNew=S.lists.filter(l=>!sL.has(l.id)&&!(l.id in SYNC.lists));
  const order=S.lists.map(l=>l.id);
  S.lists=(L.data||[]).map(fromListRow).sort((a,b)=>{const ia=order.indexOf(a.id),ib=order.indexOf(b.id);return (ia<0?999:ia)-(ib<0?999:ib)}).concat(localNew);
  SYNC.lists={};(L.data||[]).forEach(l=>{SYNC.lists[l.id]=JSON.stringify(listRow(fromListRow(l)))});
  if(S.filter!=='all'&&!listOf(S.filter))S.filter='all';
  const meP=MEMBERS[ME];
  if(meP.name&&!S.name)S.name=meP.name;
  if((S.name&&meP.name!==S.name)||meP.color!==S.accent)updateProfile();
  lastJ=snapJ();HIST=[];REDO=[];cacheLocal();
}

function subscribe(){

  CH=sb.channel('kivo-equipo',{config:{presence:{key:ME}}})
    .on('postgres_changes',{event:'*',schema:'public',table:'tasks'},onTaskEvt)
    .on('postgres_changes',{event:'*',schema:'public',table:'lists'},refetchSoon)
    .on('postgres_changes',{event:'*',schema:'public',table:'list_members'},refetchSoon)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'activity'},onActEvt)

const SIGNED={};
async function fileURL(a,download){
  if(!a||!a.path)return null;const k=a.path+(download?'#dl':'');const c=SIGNED[k];if(c&&c.exp>Date.now())return c.url;
  const {data,error}=await sb.storage.from('adjuntos').createSignedUrl(a.path,3600,download?{download:a.name}:undefined);
  if(error||!data)return null;SIGNED[k]={url:data.signedUrl,exp:Date.now()+50*6e4};return data.signedUrl;
}
function fmtSize(b){return b<1e6?Math.max(1,Math.round(b/1024))+' KB':(b/1e6).toFixed(1)+' MB'}
function fileIcon(a){const n=norm(a.name),t=a.type||'';
  if(/pdf/.test(t)||n.endsWith('.pdf'))return '📕';if(/\.(docx?|odt)$/.test(n))return '📘';if(/\.(xlsx?|csv|ods)$/.test(n))return '📗';
  if(/\.(pptx?|key)$/.test(n))return '📙';if(/\.(dwg|dxf|skp|rvt)$/.test(n))return '📐';if(/\.(cdr|ai|psd|svg|eps)$/.test(n))return '🎨';
  if(/\.(zip|rar|7z)$/.test(n))return '🗜️';if(t.startsWith('audio/'))return '🎵';if(t.startsWith('video/'))return '🎬';if(t.startsWith('image/'))return '🖼️';return '📄'}
function compressImg(file){return new Promise(res=>{
  if(/gif|svg/.test(file.type)||file.size<300000){res(file);return}
  const u=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const k=Math.min(1,1800/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b&&b.size<file.size?b:file),'image/webp',.86)};
  im.onerror=()=>{URL.revokeObjectURL(u);res(file)};im.src=u})}
const safeName=n=>String(n||'archivo').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_').slice(-80)||'archivo';
async function uploadBlob(taskId,name,blob){
  const id=uid();const path=taskId+'/'+id+'-'+safeName(name);
  const {error}=await sb.storage.from('adjuntos').upload(path,blob,{contentType:blob.type||'application/octet-stream',upsert:false});
  if(error)return null;return{id,name,type:blob.type||'',size:blob.size,at:Date.now(),path};
}
async function addFiles(x,files,redraw){
  if(!files.length)return;await flush();
  if(!(x.id in SYNC.tasks)){toast('Sin conexión: no se pueden subir archivos ahora 😕');return}
  toast(files.length>1?'Subiendo '+files.length+' archivos…':'Subiendo…');let n=0;
  for(const f of files){
    if(f.size>45e6){toast('«'+f.name+'» pesa mucho (máximo 45 MB)');continue}
    const isImg=(f.type||'').startsWith('image/');const blob=isImg?await compressImg(f):f;
    const nm=f.name&&f.name!=='image.png'?f.name:'imagen-'+today()+'.'+(((blob.type||'image/png').split('/')[1])||'png');
    const a=await uploadBlob(x.id,nm,blob);if(!a){toast('No pude subir «'+nm+'» 😕');continue}
    a.type=blob.type||f.type||'';x.attach.push(a);n++;

}

function authErr(e){const m=String((e&&e.message)||e||'');
  if(/invalid login/i.test(m))return 'Correo o contraseña incorrectos.';
  if(/already registered|already been registered/i.test(m))return 'Ese correo ya tiene una cuenta. Usa «Entrar».';
  if(/not confirmed/i.test(m))return 'Primero confirma tu correo (revisa tu bandeja de entrada o spam).';
  if(/password/i.test(m)&&/6/.test(m))return 'La contraseña debe tener al menos 6 caracteres.';
  if(/rate limit|too many/i.test(m))return 'Demasiados intentos. Espera un minuto y vuelve a intentar.';
  if(/fetch|network/i.test(m))return 'Sin conexión a internet.';
  if(/valid email|invalid email/i.test(m))return 'Escribe un correo válido.';
  return m||'Algo salió mal. Intenta otra vez.'}
function showAuth(mode,msg){
  mode=mode||'in';const a=$('#auth');a.style.display='flex';a.innerHTML='';$('#app').style.display='none';
  const card=h('div','auth-card');
  card.innerHTML='<img class="auth-logo-img" src="icons/kivo.svg" alt="Kivo"><h1>Kivo</h1><p class="muted2">Tus tareas y las de tu equipo, siempre al día.</p>';
  if(mode==='in'||mode==='up'){const tabs=h('div','seg');[['in','Entrar'],['up','Crear cuenta']].forEach(([k,l])=>{const b=h('button',mode===k?'on':'',l);b.type='button';b.onclick=()=>showAuth(k);tabs.append(b)});card.append(tabs)}
  if(mode==='reset')card.append(h('p','small-note','Escribe tu correo y te enviamos un enlace para crear una contraseña nueva.'));
  const f=h('form','auth-form');
  const nm=h('input','field');nm.placeholder='Tu nombre';nm.autocomplete='name';
  const em=h('input','field');em.type='email';em.placeholder='Correo';em.autocomplete='email';em.required=true;
  const pw=h('input','field');pw.type='password';pw.placeholder=mode==='up'?'Contraseña (mínimo 6 caracteres)':'Contraseña';pw.autocomplete=mode==='up'?'new-password':'current-password';pw.required=true;
  if(mode==='up')f.append(nm);f.append(em);if(mode!=='reset')f.append(pw);
  const err=h('div','auth-msg'+(msg&&msg.ok?' ok':''),msg?esc(msg.text||msg):'');
  const go=h('button','btn primary',mode==='up'?'Crear mi cuenta':mode==='reset'?'Enviarme el enlace':'Entrar');go.type='submit';
  f.append(err,go);
  f.onsubmit=async e=>{
    e.preventDefault();err.textContent='';err.className='auth-msg';go.disabled=true;const old=go.textContent;go.textContent='Un momento…';
    try{
      if(mode==='in'){const {error}=await sb.auth.signInWithPassword({email:em.value.trim(),password:pw.value});if(error)throw error}
      else if(mode==='up'){
        if(pw.value.length<6)throw {message:'password 6'};
        const {data,error}=await sb.auth.signUp({email:em.value.trim(),password:pw.value,options:{data:{name:nm.value.trim()},emailRedirectTo:appURL()||undefined}});
        if(error)throw error;
        if(!data||!data.session){err.className='auth-msg ok';err.textContent='¡Cuenta creada! Te enviamos un correo para confirmarla. Ábrelo y luego entra aquí.'}
      }else{
        const {error}=await sb.auth.resetPasswordForEmail(em.value.trim(),{redirectTo:appURL()||undefined});if(error)throw error;
        err.className='auth-msg ok';err.textContent='Listo. Revisa tu correo y abre el enlace.';
      }
    }catch(x){err.textContent=authErr(x)}finally{go.disabled=false;go.textContent=old}
  };
  card.append(f);
  if(mode==='in'){const fg=h('button','linkbtn','¿Olvidaste tu contraseña?');fg.onclick=()=>showAuth('reset');card.append(fg)}
  if(mode==='reset'){const bk=h('button','linkbtn','← Volver');bk.onclick=()=>showAuth('in');card.append(bk)}
  a.append(card);setTimeout(()=>{try{(mode==='up'?nm:em).focus()}catch(e){}},60);
}

  load();try{SYNC=JSON.parse(localStorage.getItem(KEY+'-sync')||'null')||{tasks:{},lists:{}}}catch(e){SYNC={tasks:{},lists:{}}}
  S.onboarded=true;const meta=session.user.user_metadata||{};if(!S.name&&meta.name)S.name=meta.name;
  MEMBERS[ME]={id:ME,name:S.name,email:MYEMAIL,color:S.accent};
  $('#auth').style.display='none';$('#app').style.display='';
  resetDraft();fillDL();renderAll();lastJ=snapJ();setSync('busy');
  try{await fetchAll();READY=true;renderAll();subscribe();await flush();
    if(!S.seeded){if(S.lists.some(l=>l.owner===ME))S.seeded=true;else firstRun()}
  }catch(e){console.warn(e);READY=true;setSync('err');setTimeout(()=>fetchAll().then(()=>{renderAll();if(!CH)subscribe();flush()}).catch(()=>{}),15000)}
  $('#txt').focus();setTimeout(tick,1500);
}
function boot(){
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFERRED=e;if(ME)renderBanner()});
  S=defaults();applyLook();
  if(window.__PENDIENTES_MOCK__)sb=window.__PENDIENTES_MOCK__;
  else{
    const cfg=getConfig();if(!cfg){showSetup();return}
    if(!window.supabase||!window.supabase.createClient){const a=$('#auth');a.style.display='flex';a.innerHTML='<div class="auth-card"><div class="auth-logo">😕</div><h1>Sin conexión</h1><p class="muted2">No se pudo cargar Kivo. Revisa tu internet y vuelve a abrir.</p><button class="btn primary" onclick="location.reload()">Reintentar</button></div>';return}
    sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  }
  sb.auth.onAuthStateChange((ev,session)=>{
    setTimeout(()=>{
      if(ev==='PASSWORD_RECOVERY'){if(session)start(session).then(newPassword);else newPassword();return}
      if(ev==='SIGNED_OUT'){if(ME)location.reload();else showAuth('in');return}
      if(session)start(session);
    },0);
  });
  if(window.kivo){const v=document.createElement('style');v.textContent='.hint{display:none}';document.head.append(v)}
  sb.auth.getSession().then(({data})=>{if(data&&data.session)start(data.session);else if(!ME)showAuth('in')}).catch(()=>showAuth('in'));
  window.addEventListener('online',()=>{if(ME&&READY){fetchAll().then(renderAll).catch(()=>{});flush()}});
  setInterval(()=>{if(!ME)return;checkDay();tick();renderHeader()},20000);
}

/* ---------- arranque ---------- */
function renderAll(){applyLook();renderHeader();renderAdd();renderList()}
let lastDay=today();
function checkDay(){if(today()!==lastDay){lastDay=today();if(D.date<today())D.date=today();renderAll()}}
$('#txt').addEventListener('input',renderAdd);
$('#txt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addTask()}});
$('#go').onclick=addTask;
$('#emoBtn').onclick=()=>emojiPicker(e=>{D.emoji=e;renderAdd();$('#txt').focus()},true);
$('#gear').onclick=()=>openSettings();
$('#searchBtn').onclick=openSearch;
$('#statsBtn').onclick=()=>{statsOff=0;openStats()};
$('#mic').onclick=toggleMic;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;save();renderList()});
document.addEventListener('keydown',e=>{
  if(!ME)return;
  if(e.key==='Escape'&&MODALS.length){closeModal();return}
  if((e.ctrlKey||e.metaKey)&&!e.altKey){
    const k=e.key.toLowerCase(),ae=document.activeElement;
    if(k==='k'){e.preventDefault();if(!MODALS.length)openSearch();return}
    const typing=(/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&!(ae.id==='txt'&&!ae.value))||ae.isContentEditable;
    if(!typing&&k==='z'&&!e.shiftKey){e.preventDefault();undo();return}
    if(!typing&&(k==='y'||(k==='z'&&e.shiftKey))){e.preventDefault();redo();return}
  }
  if((e.key==='/'||e.key==='n')&&!MODALS.length&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#txt').focus()}
});
boot();
</script>
