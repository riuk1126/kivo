<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kivo</title>
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kivo">
<style>
:root{--accent:#e8590c;--bg:#f5f5f7;--card:#fff;--card2:#faf9f7;--text:#24221f;--muted:#77746c;--soft:#aeaba3;--line:#ebe8e2;--late:#d9443a;--ok:#2f9e5b;--star:#e3a008;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);--a-soft:color-mix(in srgb,var(--accent) 13%,transparent);--a-mid:color-mix(in srgb,var(--accent) 40%,transparent);color-scheme:light}
:root[data-theme=dark]{--bg:#000000;--card:#22211f;--card2:#1d1c1a;--text:#eeece8;--muted:#a19e97;--soft:#6a675f;--line:#302e2b;--late:#ff6b61;--ok:#4cc27c;--shadow:0 1px 2px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html{min-height:100%}
body{margin:0;min-height:100vh;background:var(--bg);background-attachment:fixed;color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:680px;margin:0 auto;padding:36px 16px 120px}
/* encabezado */
header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
h1{margin:0;font-size:30px;letter-spacing:-.02em;line-height:1.15}
.sub{color:var(--muted);font-size:15px;margin-top:5px}
.grow{flex:1}
.ringbox{position:relative;flex:none;text-align:center}
.ring{width:58px;height:58px;display:block}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .5s}
.ring text{font-size:13px;font-weight:700;fill:var(--text)}
.streak{font-size:12px;font-weight:700;color:var(--accent);margin-top:2px;white-space:nowrap}
.iconb{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--card);box-shadow:var(--shadow)}
#gear:hover{transform:rotate(30deg)}
.iconb{transition:transform .3s,background .15s}
.iconb:hover{background:var(--a-soft)}
.hbtns{display:flex;gap:8px}
/* agregar */
.add{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:8px 8px 12px;margin-bottom:16px;border:2px solid transparent;transition:border-color .15s}
.add:focus-within{border-color:var(--accent)}
.add-row{display:flex;align-items:center;gap:6px}
.emo-btn{width:44px;height:44px;border-radius:12px;font-size:24px;line-height:1;flex:none;display:grid;place-items:center}
.emo-btn:hover{background:var(--a-soft)}
.emo-btn.noemo{filter:grayscale(1);opacity:.45}
#txt{flex:1;border:0;background:none;outline:none;font-size:18px;padding:10px 4px;min-width:0}
#txt::placeholder{color:var(--soft)}
.go{background:var(--accent);color:#fff;font-weight:650;padding:10px 16px;border-radius:12px;flex:none;font-size:15px}
.go:hover{filter:brightness(1.07)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 6px 0 54px}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;background:var(--card)}
.chip:hover{border-color:var(--soft);color:var(--text)}
.chip.on{background:var(--a-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.smart{padding:8px 6px 0 54px;font-size:13px;color:var(--accent);display:none}
.smart.show{display:block}
/* aviso de permisos */
.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--a-soft);border:1px solid var(--a-mid);border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:14.5px}
.banner b{flex:1;min-width:200px;font-weight:550}
.btn{padding:8px 14px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:14px;font-weight:550}
.btn:hover{border-color:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--late)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
/* pestañas y filtros */
.tabs{display:flex;gap:4px;background:var(--card);padding:4px;border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px}
.tab{flex:1;padding:9px 4px;border-radius:10px;font-size:14.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{background:var(--accent);color:#fff}
.tab .n{opacity:.75;font-weight:500;margin-left:3px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--muted);background:var(--card);box-shadow:var(--shadow);display:inline-flex;gap:6px;align-items:center}
.fchip.on{color:#fff;background:var(--fc,var(--accent))}
.fchip .c{opacity:.7;font-size:12px}
.fchip.add{background:transparent;box-shadow:none;border:1.5px dashed var(--soft);color:var(--muted)}
.fchip.add:hover{border-color:var(--accent);color:var(--accent)}
.fchip.edit{padding:5px 9px}
@media (min-width:561px){.filters{flex-wrap:wrap;overflow:visible;align-items:center;row-gap:8px}}
.fchip{line-height:1.4}
/* lista */
.sec{font-size:12.5px;font-weight:700;color:var(--muted);margin:20px 4px 8px;text-transform:uppercase;letter-spacing:.05em}
.sec.late{color:var(--late)}
.list{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:11px 10px 11px 14px;box-shadow:var(--shadow);animation:in .22s ease-out;border-left:4px solid var(--lc,transparent);cursor:pointer;transition:transform .12s}
.task:hover{transform:translateX(2px)}
@keyframes in{from{opacity:0;transform:translateY(-6px)}}
.task.leaving{transition:opacity .35s,transform .35s;opacity:0;transform:translateX(24px)}
.check{width:27px;height:27px;border-radius:50%;border:2px solid var(--soft);flex:none;display:grid;place-items:center;color:transparent;font-size:14px;font-weight:700;transition:.15s;position:relative;overflow:hidden}
.check:hover{border-color:var(--ok);color:var(--ok)}
.check.doing{border-color:var(--accent)}
.check.doing::before{content:'';position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--accent);opacity:.55}
.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.done .check::before{display:none}
.temoji{font-size:22px;flex:none;line-height:1}
.body{flex:1;min-width:0}
.t{word-break:break-word;font-weight:500}
.done .t{text-decoration:line-through;color:var(--soft)}
.meta{font-size:12.5px;color:var(--muted);margin-top:3px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meta .late{color:var(--late);font-weight:650}
.meta .today{color:var(--accent);font-weight:650}
.lchip{display:inline-flex;align-items:center;gap:4px}
.badge{background:var(--a-soft);color:var(--accent);padding:0 7px;border-radius:6px;font-weight:600}
.qb{border-radius:6px;padding:0 4px;color:var(--muted)}
.qb:hover{background:var(--a-soft);color:var(--accent)}
.note-prev{font-size:13px;color:var(--muted);margin-top:4px;font-style:italic}
.star{font-size:20px;color:var(--soft);width:34px;height:34px;border-radius:9px;flex:none}
.star:hover{background:var(--card2)}
.star.on{color:var(--star)}
.empty{text-align:center;color:var(--muted);padding:36px 16px}
.empty .big{font-size:48px;margin-bottom:6px}
.donebar{margin:22px 4px 8px}
.donebar button{font-size:13.5px;color:var(--muted);padding:6px 10px;border-radius:9px;background:var(--card);box-shadow:var(--shadow)}
.hint{text-align:center;font-size:12.5px;color:var(--soft);margin-top:34px;line-height:1.7}
.hint code{background:var(--card);padding:1px 6px;border-radius:5px;color:var(--muted)}
/* ventanas */
.ov{position:fixed;inset:0;background:rgba(12,11,10,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto;animation:fade .15s}
.ov.side{padding:0;justify-content:flex-end;align-items:stretch}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.3);width:min(520px,100%);animation:pop .18s ease-out;color:var(--text)}
.modal.small{width:min(380px,100%)}
.modal.sheet{width:min(470px,100%);border-radius:18px 0 0 18px;min-height:100%;animation:slide .22s ease-out;overflow:auto;max-height:100vh}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.mpad{padding:20px 22px}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.mh h2{margin:0;font-size:20px;flex:1}
.x{width:34px;height:34px;border-radius:9px;color:var(--muted);font-size:18px;flex:none}
.x:hover{background:var(--card2);color:var(--text)}
.lbl{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.foot{display:flex;gap:8px;align-items:center;margin-top:20px;flex-wrap:wrap}
.field{width:100%;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:9px 12px;outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{resize:vertical;min-height:90px;line-height:1.5}
select.field{cursor:pointer}
/* emojis */
.emo-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.emo-tabs button{font-size:13px;padding:4px 10px;border-radius:8px;color:var(--muted)}
.emo-tabs button.on{background:var(--a-soft);color:var(--accent);font-weight:600}
.emo-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.emo-grid button{height:40px;border-radius:9px;font-size:23px}
.emo-grid button:hover{background:var(--a-soft);transform:scale(1.15)}
/* calendario elegir fecha */
.quick{display:flex;gap:6px;flex-wrap:wrap}
.calh{display:flex;align-items:center;gap:6px;margin:14px 0 6px}
.calh b{flex:1;font-size:15px}
.calh button{width:32px;height:32px;border-radius:9px;font-size:18px}
.calh button:hover{background:var(--card2)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cgrid .dw{font-size:11.5px;color:var(--soft);font-weight:700;padding:4px 0;text-transform:uppercase}
.cgrid button{height:38px;border-radius:10px;font-size:14.5px}
.cgrid button:hover{background:var(--a-soft)}
.cgrid button.out{color:var(--soft)}
.cgrid button.past{color:var(--soft)}
.cgrid button.tod{box-shadow:inset 0 0 0 2px var(--a-mid);font-weight:700}
.cgrid button.sel{background:var(--accent);color:#fff;font-weight:700}
.cgrid button.dot{position:relative}
.cgrid button.dot::after{content:'';position:absolute;left:50%;bottom:4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.cgrid button.sel.dot::after{background:#fff}
.trow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.trow input[type=time]{width:130px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.small-note{font-size:12.5px;color:var(--soft);margin-top:6px}
/* detalle */
.dtop{display:flex;gap:10px;align-items:flex-start}
.dem{width:56px;height:56px;border-radius:14px;font-size:32px;flex:none;background:var(--card2);display:grid;place-items:center}
.dem:hover{background:var(--a-soft)}
.dtitle{flex:1;border:0;background:none;outline:none;font-size:21px;font-weight:700;resize:none;padding:12px 0 0;line-height:1.3;min-height:40px;overflow:hidden}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:4px;gap:4px;margin-top:16px}
.seg button{flex:1;padding:9px 4px;border-radius:9px;font-size:14px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.seg button.on.ok{background:var(--ok);color:#fff}
.seg button.on.doing{background:var(--accent);color:#fff}
.props{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.prop{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-align:left;font-size:15px}
.prop:hover{background:var(--card2)}
.prop .k{width:24px;text-align:center}
.prop .v{flex:1}
.prop .v small{color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:4px}
.step{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:9px}
.step:hover{background:var(--card2)}
.step .check{width:22px;height:22px;font-size:12px}
.step.done .check{background:var(--ok);border-color:var(--ok);color:#fff}
.step input{flex:1;border:0;background:none;outline:none;padding:4px 0}
.step.done input{text-decoration:line-through;color:var(--soft)}
.step .sx{opacity:0;color:var(--soft);width:26px;height:26px;border-radius:7px}
.step:hover .sx{opacity:1}
.sbar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:2px 0 8px}
.sbar i{display:block;height:100%;background:var(--ok);transition:width .3s}
.donebox{background:color-mix(in srgb,var(--ok) 10%,transparent);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);border-radius:14px;padding:14px;margin-top:18px}
.donebox .when{font-weight:650;color:var(--ok)}
.moods{display:flex;gap:6px;margin:10px 0}
.moods button{font-size:26px;width:48px;height:44px;border-radius:12px;filter:grayscale(.8);opacity:.6;transition:.15s}
.moods button:hover{opacity:1;filter:none}
.moods button.on{opacity:1;filter:none;background:var(--card);box-shadow:var(--shadow);transform:scale(1.08)}
/* ajustes */
.sw-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 3px var(--text)}
.sw-custom{position:relative;overflow:hidden;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.sw-custom input{position:absolute;inset:-8px;opacity:0;cursor:pointer}
.bgs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bgt{height:56px;border-radius:12px;border:2px solid var(--line);font-size:12.5px;font-weight:600;display:flex;align-items:flex-end;padding:6px 8px;color:#333}
.bgt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--a-mid)}
.lrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.lrow .le{width:40px;height:40px;border-radius:10px;font-size:20px;background:var(--card2)}
.lrow input[type=text]{flex:1}
.lrow input[type=color]{width:40px;height:40px;border:0;padding:0;background:none;border-radius:10px;cursor:pointer}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.tog{width:46px;height:27px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.tog::after{content:'';position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog.on{background:var(--accent)}
.tog.on::after{left:22px}
.state{font-size:13px;padding:2px 8px;border-radius:6px;background:var(--card2);color:var(--muted)}
.state.ok{color:var(--ok)}
/* alertas */
#alerts{position:fixed;top:14px;left:14px;z-index:80;display:flex;flex-direction:column;gap:10px;width:min(360px,calc(100vw - 28px))}
.al{background:var(--card);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.25);padding:14px 14px 12px;border-left:5px solid var(--accent);max-height:60vh;overflow:auto;animation:alin .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes alin{from{transform:translateX(-60px);opacity:0}}
@media (max-width:900px){#alerts{left:50%;transform:translateX(-50%)}}
.al-h{display:flex;gap:8px;align-items:flex-start}
.al-h b{flex:1;font-size:15.5px;line-height:1.3}
.al p{margin:6px 0 10px;color:var(--muted);font-size:14px;white-space:pre-line}
.al .acts{display:flex;gap:6px;flex-wrap:wrap}
.al .acts .btn{padding:6px 11px;font-size:13.5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#24221f;color:#fff;padding:12px 16px;border-radius:14px;font-size:14.5px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.28);z-index:90;animation:tin .22s ease-out;max-width:calc(100vw - 28px)}
.toast button{color:#ffc29e;font-weight:700;white-space:nowrap}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:100}
.hist-it{display:flex;gap:10px;align-items:flex-start}

/* voz */
.mic{width:44px;height:44px;border-radius:12px;font-size:20px;flex:none;display:grid;place-items:center}
.mic:hover{background:var(--a-soft)}
.mic.on{background:#e5484d;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}100%{box-shadow:0 0 0 14px rgba(229,72,77,0)}}
/* arrastrar */
.task.dragging{opacity:.35}
.drop-ph{height:48px;border:2px dashed var(--accent);border-radius:14px;opacity:.7;flex:none;background:var(--a-soft)}
/* semana */
.wnav{display:flex;align-items:center;gap:8px;margin:14px 2px 6px}
.wnav b{flex:1;text-align:center;font-size:16px;line-height:1.3}
.wnav .nb{width:38px;height:38px;border-radius:11px;background:var(--card);box-shadow:var(--shadow);font-size:19px;flex:none}
.wnav .nb:hover{color:var(--accent)}
.wday{margin-top:16px}
.wday-h{display:flex;align-items:center;gap:8px;margin:0 4px 8px}
.wday-h b{font-size:15.5px}
.wday-h .dt{color:var(--muted);font-size:14px}
.wday.is-today .wday-h b{color:var(--accent)}
.wday.past{opacity:.72}
.wadd{margin-left:auto;width:32px;height:32px;border-radius:9px;color:var(--muted);font-size:18px}
.wadd:hover{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.list.dz{min-height:46px;border-radius:14px}
.wfree{border:1.5px dashed var(--line);border-radius:14px;padding:11px 14px;color:var(--soft);font-size:14px}
/* buscar */
.sres{display:flex;flex-direction:column;gap:2px;margin-top:12px;max-height:55vh;overflow:auto}
.sr{display:flex;gap:10px;align-items:center;text-align:left;padding:9px 10px;border-radius:10px;width:100%}
.sr:hover{background:var(--card2)}
.sr .v{flex:1;min-width:0}
.sr b{display:block;font-weight:550}
.sr small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr.done b{text-decoration:line-through;color:var(--muted)}
mark{background:color-mix(in srgb,var(--accent) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
/* resumen semanal */
.statc{text-align:center;padding:6px 0 4px}
.bign{font-size:58px;font-weight:800;line-height:1;color:var(--accent);letter-spacing:-.03em}
.diff{font-size:13.5px;margin-top:6px;color:var(--muted)}
.diff.up{color:var(--ok);font-weight:600}
.bars{display:flex;gap:6px;align-items:flex-end;height:130px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar i{display:block;width:100%;max-width:40px;border-radius:8px 8px 3px 3px;background:var(--a-mid);min-height:4px}
.bar.best i{background:var(--accent)}
.bar small{font-size:11.5px;color:var(--muted);font-weight:600}
.bar span{font-size:12px;font-weight:700;min-height:16px}
.lbar{display:flex;align-items:center;gap:8px;font-size:14px;margin:7px 0}
.lbar .nm{width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbar .tr{flex:1;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.lbar .tr i{display:block;height:100%;border-radius:9px}
.lbar b{width:26px;text-align:right}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:var(--card2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.fact b{display:block;font-size:18px;color:var(--text)}
/* adjuntos */
.attg{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.att{height:92px;border-radius:12px;overflow:hidden;background:var(--card2);border:1px solid var(--line);cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.att img{width:100%;height:100%;object-fit:cover;display:block}
.att:hover{border-color:var(--accent)}
.attf{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;text-align:center;min-width:0;width:100%}
.attf span{font-size:26px}
.attf b{font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.attf small{font-size:11px;color:var(--soft)}
.att.add{flex-direction:column;gap:2px;border-style:dashed;color:var(--muted)}
.att.add span{font-size:24px}
.att.add small{font-size:11.5px}
.viewer img{max-width:100%;max-height:62vh;display:block;margin:0 auto;border-radius:12px}
.drop-on{outline:3px dashed var(--accent);outline-offset:-10px}
/* contacto */
.crow{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
a.btn{text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.meta a.qb{text-decoration:none}

/* equipo */
#auth{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;padding:20px 16px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 22%,var(--bg)),var(--bg) 60%);overflow:auto}
.auth-card{background:var(--card);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.15);padding:30px 24px;width:min(400px,100%);text-align:center;margin:auto}
.auth-logo-img{width:76px;height:76px;display:block;margin:0 auto 12px;filter:drop-shadow(0 6px 16px rgba(0,0,0,.18))}
:root[data-theme=dark] .auth-logo-img{filter:drop-shadow(0 0 1px rgba(255,255,255,.55)) drop-shadow(0 6px 16px rgba(0,0,0,.5))}
.auth-logo{width:64px;height:64px;border-radius:18px;background:var(--accent);color:#fff;font-size:34px;font-weight:800;display:grid;place-items:center;margin:0 auto 12px}
.auth-card h1{font-size:26px;margin:0 0 4px}
.muted2{color:var(--muted);margin:0 0 18px;font-size:15px}
.auth-card .seg{margin-top:0}
.auth-form{display:flex;flex-direction:column;gap:10px;margin-top:16px;text-align:left}
.auth-form .field{padding:12px 14px;font-size:16px}
.auth-form .btn{padding:12px;font-size:16px;margin-top:4px}
.auth-msg{font-size:14px;color:var(--late)}
.auth-msg:empty{display:none}
.auth-msg.ok{color:var(--ok)}
.linkbtn{margin-top:14px;color:var(--muted);font-size:14px;text-decoration:underline}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:10.5px;font-weight:700;flex:none;vertical-align:middle;letter-spacing:.02em;line-height:1}
.av.big{width:46px;height:46px;font-size:16px}
.meta .av{width:18px;height:18px;font-size:8px}
.chip .av{width:18px;height:18px;font-size:8px}
.who1{display:inline-flex;align-items:center;gap:4px}
.who{display:flex;gap:4px;align-items:center}
.whoav{position:relative;opacity:.5;display:inline-flex}
.whoav.on{opacity:1}
.whoav.on::after{content:'';position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:#2fb344;border:2px solid var(--bg)}
.whoav .av{width:34px;height:34px;font-size:12.5px;border:2px solid var(--card)}
.sync{color:var(--soft)}
.sync.err{color:var(--late)}
.pbar{display:inline-flex;align-items:center;gap:5px}
.pbar i{display:inline-block;width:46px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.pbar i b{display:block;height:100%;background:var(--accent)}
.prog{display:flex;align-items:center;gap:10px}
.prog b{min-width:42px;text-align:right}
.pbig{flex:1;height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.pbig i{display:block;height:100%;background:var(--accent);transition:width .3s}
.pbtns{display:flex;gap:6px;margin-top:8px}
.pbtns button{flex:1;padding:7px 0;border-radius:9px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted)}
.pbtns button:hover{border-color:var(--accent);color:var(--accent)}
.pbtns button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cmt{display:flex;gap:8px;align-items:flex-end}
.cmt textarea.field{flex:1;min-height:46px}
.acts-list{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.act{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.act .v{flex:1;min-width:0}
.act small{color:var(--soft);font-size:12px;margin-left:6px}
.bubble{background:var(--card2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.acct{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:14px;padding:12px}
.acct>div{flex:1;min-width:0}
.acct small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.members{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.mem{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.mem:hover{background:var(--card2)}
.mem .v{flex:1;min-width:0}
.mem small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.on-dot{width:10px;height:10px;border-radius:50%;background:#2fb344;flex:none}
.small-note code{word-break:break-all;background:var(--card2);padding:2px 6px;border-radius:5px;display:inline-block;margin-top:4px}
@media (max-width:560px){
 h1{font-size:25px}.wrap{padding-top:20px}
 .chips,.smart{padding-left:6px}
 .go{padding:10px 12px}
 .tab{font-size:13.5px}
 .modal.sheet{border-radius:0}
 .ring{width:50px;height:50px}
 .iconb{width:38px;height:38px;font-size:17px}
 header{gap:8px}
 .hbtns{gap:5px}
 .mic{width:38px}
 .crow{grid-template-columns:1fr}
 .who{display:none}
 .lbar .nm{width:86px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* =================== DISEÑO KIVO · estilo Apple =================== */
.cgrid button.sel,.cgrid button.sel.tod{color:var(--on-accent)!important}
.filters{align-items:center}
.fchip{height:30px}
:root{--bg:#f5f5f7;--card:#ffffff;--card2:#f2f2f7;--text:#1d1d1f;--muted:#6e6e73;--soft:#aeaeb2;--line:rgba(60,60,67,.12);--late:#ff3b30;--ok:#34c759;--star:#ff9f0a;--shadow:none;--fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.2);--on-accent:#fff;--mat:rgba(255,255,255,.78);--a-soft:color-mix(in srgb,var(--accent) 10%,transparent);--a-mid:color-mix(in srgb,var(--accent) 30%,transparent)}
:root[data-theme=dark]{--bg:#000000;--card:#1c1c1e;--card2:#2c2c2e;--text:#f5f5f7;--muted:#98989d;--soft:#636366;--line:rgba(84,84,88,.55);--late:#ff453a;--ok:#30d158;--star:#ffd60a;--fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);--mat:rgba(30,30,32,.78)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,Roboto,Ubuntu,sans-serif;font-size:15px;letter-spacing:-.01em}
.wrap{max-width:720px;padding:44px 20px 120px}
::selection{background:var(--a-mid)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none}
/* encabezado */
header{margin-bottom:26px;gap:14px}
h1{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1.1}
.sub{font-size:15px;margin-top:6px;color:var(--muted)}
.hbtns{gap:6px}
.iconb{width:36px;height:36px;border-radius:50%;background:var(--fill);box-shadow:none;color:var(--text)}
.iconb:hover{background:var(--fill2);transform:none}
#gear:hover{transform:rotate(45deg)}
.iconb svg,.mic svg{width:18px;height:18px}
.ring{width:46px;height:46px}
.ring circle{stroke-width:4.5}
.ring .bgc{stroke:var(--fill2)}
.ring text{font-size:12.5px;font-weight:600}
.streak{color:var(--muted);font-weight:600;font-size:11.5px}
/* caja para agregar */
.add{background:var(--card);border:0;border-radius:16px;box-shadow:0 0 0 .5px var(--line);padding:8px 8px 12px;margin-bottom:22px;transition:box-shadow .2s}
.add:focus-within{border:0;box-shadow:0 0 0 .5px var(--line),0 8px 30px rgba(0,0,0,.06)}
:root[data-theme=dark] .add:focus-within{box-shadow:0 0 0 .5px var(--line),0 8px 30px rgba(0,0,0,.6)}
#txt{font-size:17px}
.emo-btn{width:38px;height:38px;font-size:21px;border-radius:50%}
.emo-btn:hover,.mic:hover{background:var(--fill)}
.emo-btn.noemo{opacity:.35}
.mic{width:38px;height:38px;border-radius:50%;color:var(--muted)}
.mic.on{background:var(--late);color:#fff}
.go{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:9px 18px;font-size:14.5px;font-weight:600}
.go:hover{filter:none;opacity:.85}
.chips{gap:6px;padding:6px 6px 0 48px}
.chip{border:0;background:var(--fill);color:var(--text);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;gap:5px}
.chip:hover{background:var(--fill2);color:var(--text)}
.chip.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.chip svg{width:13px;height:13px;flex:none}
.smart{color:var(--muted);padding-left:48px}
/* control segmentado */
.tabs{background:var(--fill);border-radius:10px;padding:2px;gap:0;box-shadow:none;margin-bottom:14px}
.tab{border-radius:8px;padding:7px 4px;font-size:13.5px;font-weight:500;color:var(--text)}
.tab:hover{color:var(--text)}
.tab.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 .5px 1.5px rgba(0,0,0,.12)}
:root[data-theme=dark] .tab.on{background:#636366}
.tab .n{color:var(--muted);opacity:1;font-weight:500}
/* listas (filtros) */
.filters{gap:6px;margin-bottom:6px}
.fchip{background:var(--fill);box-shadow:none;color:var(--text);font-weight:500;font-size:13px;padding:5px 12px}
.fchip:hover{background:var(--fill2)}
.fchip.on{background:var(--fc,var(--accent));color:#fff}
.fchip.on:not([style]){color:var(--on-accent)}
.fchip .c{opacity:.6}
.fchip.add{border:1px dashed var(--soft);background:transparent;color:var(--muted)}
.fchip.add:hover{border-color:var(--text);color:var(--text)}
/* secciones y tareas: lista agrupada */
.sec{font-size:20px;font-weight:700;letter-spacing:-.025em;text-transform:none;color:var(--text);margin:28px 4px 10px}
.sec.late{color:var(--late)}
.list{background:var(--card);border-radius:14px;gap:0;overflow:hidden;box-shadow:0 0 0 .5px var(--line)}
.task{background:transparent;border-radius:0;box-shadow:none;border-left:0;padding:12px 14px 12px 16px;gap:12px;position:relative;animation:none}
.task:hover{transform:none;background:var(--card2)}
:root[data-theme=dark] .task:hover{background:#242426}
.task:not(:last-child)::after{content:'';position:absolute;left:50px;right:0;bottom:0;height:.5px;background:var(--line)}
.task.leaving{transform:none;opacity:0}
.check{width:22px;height:22px;border:1.5px solid var(--lc,var(--soft));font-size:12px}
.check:hover{border-color:var(--lc,var(--text));color:var(--lc,var(--text))}
.check.doing{border-color:var(--lc,var(--accent))}
.check.doing::before{background:var(--lc,var(--accent));opacity:.5}
.done .check{background:var(--lc,var(--ok));border-color:var(--lc,var(--ok))}
.temoji{font-size:19px}
.t{font-weight:400;font-size:15.5px;letter-spacing:-.015em}
.meta{font-size:12.5px;gap:8px;margin-top:2px}
.meta .today{color:var(--late);font-weight:500}
.meta .late{color:var(--late);font-weight:500}
.badge{background:var(--fill);color:var(--text);font-weight:500;border-radius:5px}
.qb{color:var(--muted)}
.qb:hover{background:var(--fill);color:var(--text)}
.star{font-size:17px;color:var(--fill2);width:30px;height:30px;border-radius:50%}
.star:hover{background:var(--fill);color:var(--soft)}
.star.on{color:var(--star)}
.lchip{color:var(--muted)}
.pbar i{background:var(--fill2)}
.pbar i b{background:var(--lc,var(--accent))}
.empty{color:var(--muted);padding:44px 16px;font-size:15px}
.empty .big{font-size:40px;opacity:.85;margin-bottom:10px}
.donebar button{background:transparent;box-shadow:none;color:var(--accent);font-weight:500;padding:6px 4px}
:root[data-theme=dark] .donebar button{color:var(--text)}
.hint{color:var(--soft);font-size:12px}
.hint code{background:var(--fill);color:var(--muted)}
/* botones y campos */
.btn{border:0;background:var(--fill);border-radius:10px;font-weight:500;font-size:14.5px;padding:8px 14px;color:var(--text)}
.btn:hover{border:0;background:var(--fill2)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:none;opacity:.85;background:var(--accent)}
.btn.danger{color:var(--late)}
.btn.ghost{background:transparent;color:var(--accent)}
:root[data-theme=dark] .btn.ghost{color:var(--text)}
.btn.ghost:hover{background:var(--fill)}
.field{border:0;background:var(--fill);border-radius:10px;padding:10px 12px}
.field:focus{border:0;box-shadow:0 0 0 3px var(--a-mid)}
textarea.field{min-height:84px}
.banner{background:var(--card);border:0;border-radius:14px;box-shadow:0 0 0 .5px var(--line);padding:12px 14px}
/* ventanas */
.ov{background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.modal{background:var(--card);border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.28),0 0 0 .5px var(--line)}
.modal.sheet{background:var(--bg);border-radius:16px 0 0 16px}
.mpad{padding:22px}
.mh h2{font-size:20px;font-weight:700;letter-spacing:-.025em}
.x{border-radius:50%;width:30px;height:30px;font-size:14px;background:var(--fill);color:var(--muted)}
.x:hover{background:var(--fill2);color:var(--text)}
.lbl{font-size:12.5px;font-weight:500;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);margin:22px 4px 7px}
.small-note{color:var(--muted)}
.seg{background:var(--fill);border-radius:10px;padding:2px;gap:0}
.seg button{border-radius:8px;font-weight:500;font-size:13.5px;color:var(--text);padding:7px 4px}
.seg button.on,.seg button.on.ok,.seg button.on.doing{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 .5px 1.5px rgba(0,0,0,.12)}
:root[data-theme=dark] .seg button.on,:root[data-theme=dark] .seg button.on.ok,:root[data-theme=dark] .seg button.on.doing{background:#636366}
.seg button.on.ok{color:var(--ok)}
/* detalle: grupos tipo Ajustes */
.dem{border-radius:50%;width:52px;height:52px;background:var(--fill);font-size:28px}
.dtitle{font-size:22px;letter-spacing:-.025em}
.props{background:var(--card);border-radius:12px;gap:0;overflow:hidden;box-shadow:0 0 0 .5px var(--line)}
.prop{border-radius:0;padding:12px 14px;position:relative}
.prop:hover{background:var(--card2)}
.prop:not(:last-child)::after{content:'';position:absolute;left:50px;right:0;bottom:0;height:.5px;background:var(--line)}
.prop .k{color:var(--muted);display:grid;place-items:center}
.prop .k svg{width:18px;height:18px}
.steps{background:var(--card);border-radius:12px;padding:4px;box-shadow:0 0 0 .5px var(--line)}
.step:hover{background:var(--card2)}
.sbar{background:var(--fill2)}
.donebox{background:var(--card);border:0;box-shadow:0 0 0 .5px var(--line);border-radius:12px}
.moods button.on{background:var(--fill);box-shadow:none}
.pbig{background:var(--fill2);height:6px}
.pbtns button{border:0;background:var(--fill);color:var(--text);font-weight:500}
.pbtns button:hover{background:var(--fill2);color:var(--text)}
.pbtns button.on{background:var(--accent);color:var(--on-accent)}
.cgrid button.sel{background:var(--accent);color:var(--on-accent)}
.cgrid button.tod{box-shadow:none;color:var(--late);font-weight:700}
.cgrid button.dot::after{background:var(--muted)}
.cgrid button:hover{background:var(--fill)}
.calh button:hover{background:var(--fill)}
.bubble{background:var(--fill);border:0;border-radius:4px 16px 16px 16px}
.acct{background:var(--card);box-shadow:0 0 0 .5px var(--line)}
.att{border:0;background:var(--fill)}
.att.add{border:1px dashed var(--soft);background:transparent}
.lrow .le{background:var(--fill);border-radius:50%}
.tog{width:51px;height:31px;background:var(--fill2)}
.tog::after{width:27px;height:27px;left:2px;top:2px;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16)}
.tog.on{background:var(--ok)}
.tog.on::after{left:22px}
.state{background:var(--fill)}
.bgt{border:0;box-shadow:0 0 0 .5px var(--line)}
.bgt.on{box-shadow:0 0 0 2px var(--accent)}
.sw{border:2px solid var(--bg);box-shadow:0 0 0 .5px var(--line)}
.sw.on{box-shadow:0 0 0 2px var(--text)}
.fact{background:var(--card);box-shadow:0 0 0 .5px var(--line)}
.bign{color:var(--text)}
.bar i{background:var(--fill2)}
.bar.best i{background:var(--accent)}
.sr:hover{background:var(--fill)}
.mem:hover{background:var(--fill)}

.wday-h b{font-size:17px;font-weight:600;letter-spacing:-.02em}

/* ---- íconos de un solo color ---- */
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none;display:inline-block}
.emo-mono{filter:grayscale(1);opacity:.8}
.fchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;line-height:1;vertical-align:middle;box-sizing:border-box;margin:0}
.fchip .ico{width:15px;height:15px}
.fchip .shr .ico{width:14px;height:14px;opacity:.7}
.fchip.add{height:32px}
.chip .ico{width:14px;height:14px}
.temoji{color:var(--muted);display:inline-grid;place-items:center;font-size:19px}
.temoji .ico{width:20px;height:20px}
.dem{color:var(--text)}
.dem .ico{width:26px;height:26px}
.lrow .le{display:grid;place-items:center}
.lrow .le .ico{width:20px;height:20px}
.emo-btn{color:var(--muted)}
.emo-btn .ico{width:21px;height:21px}
.empty .big{color:var(--soft)}

const END='(?=[\\s.,;!?]|$)';
function parseSmart(raw){

  const NUM={una:1,uno:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12};

  const setT=(H,M,sx,defPm)=>{H=+H;M=+(M||0);if(H>23||M>59)return false;sx=norm(sx||'');
    if(/p|tarde|noche/.test(sx)&&H<12)H+=12;else if(/^a|manana/.test(sx)&&H===12)H=0;else if(!sx&&defPm&&H>=1&&H<=7)H+=12;
    out.time=pad(H)+':'+pad(M)};
  take(new RegExp('\\s(?:a\\s+las?|tipo|como\\s+a\\s+las?)\\s+(\\d{1,2})(?:[:.h](\\d{2}))?\\s*(am|pm|a\\.\\s?m\\.?|p\\.\\s?m\\.?|de\\s+la\\s+ma[ñn]ana|de\\s+la\\s+tarde|de\\s+la\\s+noche|del\\s+mediod[ií]a)?'+END,'i'),m=>setT(m[1],m[2],m[3],true))||
  take(new RegExp('\\s(\\d{1,2})(?::(\\d{2}))?\\s*(am|pm|a\\.\\s?m\\.?|p\\.\\s?m\\.?)'+END,'i'),m=>setT(m[1],m[2],m[3],false))||
  take(new RegExp('\\s(\\d{1,2}):(\\d{2})'+END),m=>setT(m[1],m[2],'',false));
  take(new RegExp('\\s(?:para\\s+)?pasado\\s+ma[ñn]ana'+END,'i'),()=>{out.date=plus(2)})||
  take(new RegExp('\\s(?:para\\s+)?(?<!la\\s)ma[ñn]ana'+END,'i'),()=>{out.date=plus(1)})||
  take(new RegExp('\\s(?:para\\s+)?hoy'+END,'i'),()=>{out.date=today()})||
  take(new RegExp('\\s(?:para\\s+)?(?:el\\s+|este\\s+|pr[oó]ximo\\s+)?(lunes|martes|mi[eé]rcoles|jueves|viernes|s[aá]bado|domingo)'+END,'i'),m=>{const i=DIAS.indexOf(norm(m[1]));let d=(i-new Date().getDay()+7)%7;if(d===0)d=7;out.date=plus(d)})||
  take(new RegExp('\\s(?:para\\s+)?(?:el\\s+)?(\\d{1,2})\\s+de\\s+(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)'+END,'i'),m=>{let mi=MESES.indexOf(norm(m[2]));if(mi<0)mi=8;const n=+m[1];const d=new Date(new Date().getFullYear(),mi,n);if(d.getDate()!==n)return false;if(iso(d)<today())d.setFullYear(d.getFullYear()+1);out.date=iso(d)})||
  take(new RegExp('\\s(\\d{1,2})/(\\d{1,2})(?:/(\\d{2,4}))?'+END),m=>{const n=+m[1],mo=+m[2]-1;let y=m[3]?(+m[3]<100?2000+(+m[3]):+m[3]):new Date().getFullYear();const d=new Date(y,mo,n);if(d.getMonth()!==mo||d.getDate()!==n)return false;if(!m[3]&&iso(d)<today())d.setFullYear(y+1);out.date=iso(d)});
  take(/\s@([^\s@]+)/,m=>{out.mention=norm(m[1])});
  take(/\s#([^\s#]+)/,m=>{const q=norm(m[1]);const l=S.lists.find(l=>norm(l.name).replace(/\s+/g,'').startsWith(q));if(!l)return false;out.list=l.id});
  take(/\s!{1,3}(?=\s|$)/,()=>{out.star=true});
  let phone=null;take(/\s(?:\+?51[\s-]?)?(9\d{2}[\s-]?\d{3}[\s-]?\d{3})(?=[\s.,;!?]|$)/,m=>{phone=m[1].replace(/\D/g,'')});
  {const ns=norm(s);const c=(S.contacts||[]).filter(c=>c.name&&c.name.length>=3).sort((a,b)=>b.name.length-a.name.length).find(c=>new RegExp('(^|\\s)'+norm(c.name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=[\\s.,;!?]|$)').test(ns));if(c)out.contact={name:c.name,phone:c.phone||''}}
  if(phone){const k=(S.contacts||[]).find(c=>c.phone===phone);out.contact={name:(k&&k.name)||(out.contact&&out.contact.name)||'',phone}}
  if(out.date)out.found.push('📅 '+fmtDate(out.date));
  if(out.time)out.found.push('⏰ '+fmtTime(out.time));
  if(out.list){const l=listOf(out.list);out.found.push(l.name)}

  if(out.contact)out.found.push('👤 '+(out.contact.name||out.contact.phone));
  out.text=s.replace(/\s+/g,' ').trim().replace(/\s+(para el|para|el|a|en|de|este)$/i,'').trim();

}

/* ---------- versión y actualizaciones (programa de escritorio) ---------- */
let UPD={state:'idle'},KVER='';
function updText(u){
  switch(u.state){
    case 'checking':return 'Buscando actualizaciones…';
    case 'downloading':return 'Descargando la versión '+(u.version||'nueva')+'… '+(u.percent||0)+'%';
    case 'ready':return '¡La versión '+u.version+' está lista para instalarse!';
    case 'latest':return 'Tienes la última versión ✓';
    case 'error':return 'No se pudo buscar actualizaciones. Revisa tu internet.';
    case 'dev':return 'Versión de prueba';
    default:return 'Kivo se actualiza solo.';
  }
}
function renderVersionBox(el){
  const vb=el||$('#set-version');if(!vb)return;vb.innerHTML='';
  const img=h('img');img.src='icons/kivo.svg';img.style.cssText='width:44px;height:44px;flex:none';
  const t=h('div','',`<b>Kivo ${esc(KVER)}</b><small>${esc(updText(UPD))}</small>`);
  vb.append(img,t);
  if(UPD.state==='ready'){const b=h('button','btn primary','🔄 Reiniciar y actualizar');b.onclick=()=>kivo.installUpdate();vb.append(b)}
  else if(UPD.state!=='downloading'&&UPD.state!=='checking'&&UPD.state!=='dev'){const b=h('button','btn','Buscar actualizaciones');b.onclick=()=>{UPD={state:'checking'};renderVersionBox();kivo.checkUpdate()};vb.append(b)}
}
function onUpdState(u){
  const prev=UPD.state;UPD=u||{state:'idle'};renderVersionBox();renderBanner();
  if(UPD.state==='ready'&&prev!=='ready')toast('✨ Kivo '+UPD.version+' está lista','Reiniciar y actualizar',()=>kivo.installUpdate());
}
if(window.kivo&&kivo.onUpdate){kivo.onUpdate(onUpdState);kivo.version().then(v=>{KVER=v;renderVersionBox()});kivo.updateState().then(onUpdState)}

function weekAcc(l){

/* ---------- hecho / repetir ---------- */
function nextDate(d,rep){
  const x=pd(d||today());
  if(rep==='day')x.setDate(x.getDate()+1);
  else if(rep==='week5'){do{x.setDate(x.getDate()+1)}while(x.getDay()===0||x.getDay()===6)}
  else if(rep==='week')x.setDate(x.getDate()+7);
  else if(rep==='month'){const day=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+1);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}
  let s=iso(x);if(s<today()&&rep)return nextDate(s,rep);return s;
}
function setDone(x,done){
  if(done){
    x.status='done';x.doneAt=Date.now();x.doneOn=today();x.snooze=null;x.doneBy=ME;x.progress=100;
    {const T=tplOf(listOf(x.list));if(T)x.stage=T.stages[T.stages.length-1]}
    if(x.repeat&&!x.spawned){x.spawned=true;const n=fixTask(JSON.parse(JSON.stringify(x)));Object.assign(n,{id:uid(),owner:ME,progress:0,doneBy:null,stage:null,status:'todo',doneAt:null,doneOn:null,doneNote:'',mood:'',alerted:'',spawned:false,date:nextDate(x.date,x.repeat),at:Date.now()});n.subtasks.forEach(s=>{s.done=false;s.id=uid()});S.tasks.push(n)}
  }else{x.status='todo';x.doneAt=null;x.doneOn=null;x.doneBy=null;if(x.progress===100)x.progress=0;const T=tplOf(listOf(x.list));if(T&&x.stage===T.stages[T.stages.length-1])x.stage=T.stages[T.stages.length-2]}

}

  open().filter(mineOrFree).forEach(x=>{

    const at=dueMs(x)-Number(x.remind||0)*6e4,key=x.date+'|'+x.time+'|'+x.remind;

  if(S.lastMorning!==t&&hm>=S.morning){
    S.lastMorning=t;save();const op=open().filter(mineOrFree),td=op.filter(x=>x.date===t),late=op.filter(x=>x.date&&x.date<t);
    if(td.length+late.length)fireSummary(greet()+(S.name?', '+S.name:'')+' ☀️ Hoy tienes '+(td.length+late.length)+' pendiente'+(td.length+late.length>1?'s':''),listTxt(late.concat(td))+(late.length?'\n⚠️ '+late.length+' atrasada'+(late.length>1?'s':''):''),'hoy');
  }
  if(S.lastEvening!==t&&hm>=S.evening){

    if(tm.length)fireSummary('🌙 Para mañana tienes '+tm.length+' pendiente'+(tm.length>1?'s':''),listTxt(tm),'prox');
  }

  if(dow===0&&hm>=S.evening){wk=weekStart(0);off=0}else if(dow===1){wk=weekStart(-1);off=-1}
  if(wk&&S.lastWeekly!==wk){
    S.lastWeekly=wk;save();const n=S.tasks.filter(x=>x.status==='done'&&x.doneOn>=wk&&x.doneOn<=plus(6,wk)).length;

    inAppAlert(title,body,[['Ver resumen',()=>{statsOff=off;openStats()},true]],60000);
  }
}

function sfx(kind){
  if(!S.sound)return;const c=ac();if(!c)return;const t=c.currentTime;
  const notes=kind==='alert'?[[784,0],[1047,.16],[1319,.32]]:[[660,0],[990,.09]];
  notes.forEach(([f,dl])=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+dl);g.gain.linearRampToValueAtTime(kind==='alert'?.2:.12,t+dl+.02);g.gain.exponentialRampToValueAtTime(.001,t+dl+(kind==='alert'?.6:.3));o.connect(g);g.connect(c.destination);o.start(t+dl);o.stop(t+dl+.65)});

const FX=$('#fx'),G=FX.getContext('2d');let parts=[],raf=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(x,y,n,sp){
  if(reduce)return;const cols=[S.accent,'#ffd43b','#51cf66','#4dabf7','#f783ac','#ff922b'];
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=Math.random()*sp+2;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.6,s:4+Math.random()*5,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:70+Math.random()*40})}
  if(!raf)loop();
}
function bigParty(){burst(innerWidth*.2,innerHeight*.8,70,13);burst(innerWidth*.8,innerHeight*.8,70,13);setTimeout(()=>burst(innerWidth/2,innerHeight*.4,60,10),250);sfx('alert')}
function loop(){
  const dpr=devicePixelRatio||1;if(FX.width!==innerWidth*dpr){FX.width=innerWidth*dpr;FX.height=innerHeight*dpr}
  G.setTransform(dpr,0,0,dpr,0,0);G.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{p.vy+=.28;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;G.save();G.globalAlpha=Math.min(1,p.life/25);G.translate(p.x,p.y);G.rotate(p.r);G.fillStyle=p.c;G.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);G.restore()});
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+30);raf=parts.length?requestAnimationFrame(loop):(G.clearRect(0,0,innerWidth,innerHeight),null);
}

let DRAG=null,CURDETAIL=null;
function whenTxt(d){return !d?'sin fecha':d===today()?'hoy':d===plus(1)?'mañana':'el '+fmtDate(d).toLowerCase()}
function setupDrop(l,dropDate){
  l.addEventListener('dragover',e=>{
    if(!DRAG)return;const inside=[...l.children].some(r=>r.dataset&&r.dataset.id===DRAG);
    if(!inside&&dropDate===undefined)return;
    e.preventDefault();e.dataTransfer.dropEffect='move';
    const rows=[...l.querySelectorAll('.task:not(.dragging)')];
    const after=rows.find(r=>{const b=r.getBoundingClientRect();return e.clientY<b.top+b.height/2});
    let ph=document.querySelector('.drop-ph');if(!ph)ph=h('div','drop-ph');
    if(after){if(ph.nextSibling!==after||ph.parentNode!==l)l.insertBefore(ph,after)}else if(ph.parentNode!==l||ph.nextSibling)l.append(ph);
  });
  l.addEventListener('drop',e=>{
    if(!DRAG)return;e.preventDefault();const id=DRAG;DRAG=null;
    const x=S.tasks.find(t=>t.id===id);if(!x)return;
    const ids=[];[...l.children].forEach(c=>{if(c.classList.contains('drop-ph'))ids.push(id);else if(c.dataset&&c.dataset.id&&c.dataset.id!==id)ids.push(c.dataset.id)});
    if(!ids.includes(id))ids.push(id);
    document.querySelectorAll('.drop-ph').forEach(p=>p.remove());
    if(dropDate!==undefined&&x.date!==dropDate){x.date=dropDate;x.alerted='';x.snooze=null;toast('Movida para '+whenTxt(dropDate)+' 👌')}
    ids.forEach((k,i)=>{const t=S.tasks.find(y=>y.id===k);if(t)t.ord=i});
    save();renderList();
  });
}

/* ---------- buscar ---------- */
function hl(text,q){
  const map=[];let ns='';
  for(let i=0;i<text.length;i++){const c=norm(text[i]);for(let k=0;k<c.length;k++)map.push(i);ns+=c}
  const k=ns.indexOf(q);if(k<0||!q)return esc(text);
  const a=map[k],b=map[k+q.length-1]+1;return esc(text.slice(0,a))+'<mark>'+esc(text.slice(a,b))+'</mark>'+esc(text.slice(b));
}

  const inp=h('input','field');inp.placeholder='Busca una tarea, nota, paso o contacto…';inp.style.fontSize='17px';box.append(inp);
  const res=h('div','sres');box.append(res);let first=null;

      const i=norm(hay).indexOf(q);if(i<0)return null;
      let snip='';if(!norm(t.text).includes(q)){const st=Math.max(0,i-30);snip=(st?'…':'')+hay.slice(st,i+70).replace(/\n/g,' ')}
      return{t,snip}}).filter(Boolean);
    hits.sort((a,b)=>((a.t.status==='done')-(b.t.status==='done'))||(b.t.at-a.t.at));

  const ac=new AudioContext();const rec=new model.KaldiRecognizer(ac.sampleRate);

  });

}

const SIGNED={};
async function fileURL(a,download){
  if(!a||!a.path)return null;const k=a.path+(download?'#dl':'');const c=SIGNED[k];if(c&&c.exp>Date.now())return c.url;
  const {data,error}=await sb.storage.from('adjuntos').createSignedUrl(a.path,3600,download?{download:a.name}:undefined);
  if(error||!data)return null;SIGNED[k]={url:data.signedUrl,exp:Date.now()+50*6e4};return data.signedUrl;
}

function fileIcon(a){const n=norm(a.name),t=a.type||'';
  if(/pdf/.test(t)||n.endsWith('.pdf'))return '📕';if(/\.(docx?|odt)$/.test(n))return '📘';if(/\.(xlsx?|csv|ods)$/.test(n))return '📗';
  if(/\.(pptx?|key)$/.test(n))return '📙';if(/\.(dwg|dxf|skp|rvt)$/.test(n))return '📐';if(/\.(cdr|ai|psd|svg|eps)$/.test(n))return '🎨';
  if(/\.(zip|rar|7z)$/.test(n))return '🗜️';if(t.startsWith('audio/'))return '🎵';if(t.startsWith('video/'))return '🎬';if(t.startsWith('image/'))return '🖼️';return '📄'}
function compressImg(file){return new Promise(res=>{
  if(/gif|svg/.test(file.type)||file.size<300000){res(file);return}
  const u=URL.createObjectURL(file);const im=new Image();
  im.onload=()=>{const k=Math.min(1,1800/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b&&b.size<file.size?b:file),'image/webp',.86)};
  im.onerror=()=>{URL.revokeObjectURL(u);res(file)};im.src=u})}
const safeName=n=>String(n||'archivo').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_').slice(-80)||'archivo';

function aiExtract(txt){
  if(!txt||!/"kivo"\s*:/.test(txt))return null;
  let s=txt;const m=s.match(/```(?:json)?\s*([\s\S]*?)```/);if(m&&/"kivo"/.test(m[1]))s=m[1];
  const a=s.indexOf('{'),b=s.lastIndexOf('}');if(a<0||b<a)return null;s=s.slice(a,b+1);
  const tries=[s,s.replace(/,\s*([}\]])/g,'$1'),s.replace(/[“”]/g,'"').replace(/,\s*([}\]])/g,'$1')];
  for(const t of tries){try{const o=JSON.parse(t);if(o&&o.kivo)return o}catch(e){}}
  return null;
}
const AI_DAY={dom:0,domingo:0,lun:1,lunes:1,mar:2,martes:2,mie:3,mié:3,miercoles:3,miércoles:3,jue:4,jueves:4,vie:5,viernes:5,sab:6,sáb:6,sabado:6,sábado:6};

const aiTime=v=>{const m=String(v||'').match(/(\d{1,2})(?::(\d{2}))?/);if(!m)return '';const hh=Math.min(23,Number(m[1])),mm=Math.min(59,Number(m[2]||0));return pad(hh)+':'+pad(mm)};
const aiDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||''))?String(v):'';
function aiSlots(a){return (Array.isArray(a)?a:[]).map(s=>{const d=aiDays(s.days||s.dias),st=aiTime(s.start||s.inicio),en=aiTime(s.end||s.fin);if(!d.length||!st)return null;return {id:uid(),d,s:st,e:en&&en>st?en:fromMin(toMin(st)+60),label:s.label||s.nombre||'',room:s.room||s.lugar||''}}).filter(Boolean)}

    const e={ref:String(sp.ref||i),l,isNew:!l,name:l?l.name:String(sp.name||'Nuevo espacio').slice(0,40),kind:l?l.kind:kind,meta};

function authErr(e){const m=String((e&&e.message)||e||'');
  if(/invalid login/i.test(m))return 'Correo o contraseña incorrectos.';
  if(/already registered|already been registered/i.test(m))return 'Ese correo ya tiene una cuenta. Usa «Entrar».';
  if(/not confirmed/i.test(m))return 'Primero confirma tu correo (revisa tu bandeja de entrada o spam).';
  if(/password/i.test(m)&&/6/.test(m))return 'La contraseña debe tener al menos 6 caracteres.';
  if(/rate limit|too many/i.test(m))return 'Demasiados intentos. Espera un minuto y vuelve a intentar.';
  if(/fetch|network/i.test(m))return 'Sin conexión a internet.';
  if(/valid email|invalid email/i.test(m))return 'Escribe un correo válido.';
  return m||'Algo salió mal. Intenta otra vez.'}
function showAuth(mode,msg){

  if(mode==='reset')card.append(h('p','small-note','Escribe tu correo y te enviamos un enlace para crear una contraseña nueva.'));
  const f=h('form','auth-form');
  const nm=h('input','field');nm.placeholder='Tu nombre';nm.autocomplete='name';
  const em=h('input','field');em.type='email';em.placeholder='Correo';em.autocomplete='email';em.required=true;
  const pw=h('input','field');pw.type='password';pw.placeholder=mode==='up'?'Contraseña (mínimo 6 caracteres)':'Contraseña';pw.autocomplete=mode==='up'?'new-password':'current-password';pw.required=true;
  if(mode==='up')f.append(nm);f.append(em);if(mode!=='reset')f.append(pw);

  f.append(err,go);
  f.onsubmit=async e=>{
    e.preventDefault();err.textContent='';err.className='auth-msg';go.disabled=true;const old=go.textContent;go.textContent='Un momento…';

      else if(mode==='up'){

        err.className='auth-msg ok';err.textContent='Listo. Revisa tu correo y abre el enlace.';

  };
  card.append(f);

  if(mode==='reset'){const bk=h('button','linkbtn','← Volver');bk.onclick=()=>showAuth('in');card.append(bk)}

function boot(){

  S=defaults();applyLook();

    sb=window.supabase.createClient(cfg.url,cfg.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

  window.addEventListener('online',()=>{if(ME&&READY){fetchAll().then(renderAll).catch(()=>{});flush()}});

function renderAll(){applyLook();renderHeader();renderAdd();renderList()}
let lastDay=today();
function checkDay(){if(today()!==lastDay){lastDay=today();if(D.date<today())D.date=today();renderAll()}}
$('#txt').addEventListener('input',renderAdd);
$('#txt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addTask()}});
$('#go').onclick=addTask;
$('#emoBtn').onclick=()=>emojiPicker(e=>{D.emoji=e;renderAdd();$('#txt').focus()},true);
$('#gear').onclick=()=>openSettings();
$('#searchBtn').onclick=openSearch;
$('#aiBtn').onclick=openAI;
$('#statsBtn').onclick=()=>{statsOff=0;openStats()};
$('#mic').onclick=toggleMic;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;save();renderList()});
document.addEventListener('keydown',e=>{
  if(!ME)return;
  if(e.key==='Escape'&&MODALS.length){closeModal();return}
  if((e.ctrlKey||e.metaKey)&&!e.altKey){
    const k=e.key.toLowerCase(),ae=document.activeElement;
    if(k==='k'){e.preventDefault();if(!MODALS.length)openSearch();return}
    const typing=(/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&!(ae.id==='txt'&&!ae.value))||ae.isContentEditable;
    if(!typing&&k==='z'&&!e.shiftKey){e.preventDefault();undo();return}
    if(!typing&&(k==='y'||(k==='z'&&e.shiftKey))){e.preventDefault();redo();return}
  }
  if((e.key==='/'||e.key==='n')&&!MODALS.length&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#txt').focus()}
});
boot();
</script>
</body>
</html>
