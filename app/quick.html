<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Anotar en Kivo</title>
<style>
:root{--bg:#ffffff;--text:#1d1d1f;--muted:#6e6e73;--fill:rgba(118,118,128,.12);--accent:#1d1d1f;--on:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--fill:rgba(118,118,128,.24);--accent:#f5f5f7;--on:#000;color-scheme:dark}}
html,body{margin:0;background:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
.box{margin:6px;background:var(--bg);color:var(--text);border-radius:18px;box-shadow:0 10px 36px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.12);padding:12px 14px 10px;display:flex;flex-direction:column;gap:8px;-webkit-app-region:drag}
.h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:650;color:var(--muted)}
.k{width:22px;height:22px;border-radius:7px;background:var(--accent);color:var(--on);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.h small{margin-left:auto;font-weight:500}
form{display:flex;gap:8px;-webkit-app-region:no-drag}
input{flex:1;min-width:0;border:0;background:var(--fill);border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;color:var(--text);outline:none;-webkit-user-select:text;user-select:text}
button{border:0;background:var(--accent);color:var(--on);border-radius:12px;padding:0 16px;font:inherit;font-weight:650;font-size:14px;cursor:pointer}
</style></head><body>
<div class="box"><div class="h"><span class="k">K</span>Anotar en Kivo<small>Enter para guardar · Esc para cerrar</small></div>
<form id="f"><input id="t" placeholder="Ej.: Pedido de polos viernes #tinta 10am" autocomplete="off" maxlength="300"><button>Agregar</button></form></div>
<script>
const t=document.getElementById('t');
const focus=()=>{t.value='';setTimeout(()=>t.focus(),20)};
if(window.kq){kq.onOpen(focus)}focus();
document.getElementById('f').onsubmit=e=>{e.preventDefault();const v=t.value.trim();if(window.kq)kq.add(v);t.value=''};
addEventListener('keydown',e=>{if(e.key==='Escape'&&window.kq)kq.close()});
</script></body></html>
